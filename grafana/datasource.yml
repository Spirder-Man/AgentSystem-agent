# ═══════════════════════════════════════
# Grafana — Prometheus 数据源配置
# 自动挂载到容器内，Grafana 启动时自动加载
# ═══════════════════════════════════════
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
