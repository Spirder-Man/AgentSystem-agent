<script>
// ========== Data (label, desc, file, dataLogic, bizLogic) ==========
const N = (l,d,f,dl,bl) => ({label:l,desc:d||'',file:f||'',dataLogic:dl||'',bizLogic:bl||''});
const LN = (l,d,f,dl,bl,ch) => { const n=N(l,d,f,dl,bl); n.children=ch||[]; return n; };

const trees = [
LN('🧠 AI 核心引擎 (Agent1/)',

  '通过 Program.cs 统一入口，按运行模式(Console/API)加载不同服务栈；模块工厂根据 IntentRouter 分发结果动态创建对应 AI 模块',
  [
  LN('Modules · AI推理模块 (12个)',

      N('CoTSolidModule / CoTStreamModule','链式思维推理（同步+流式），逐步分解复杂合规问题。','Agent1/Modules/CoTSolidModule.cs / CoTStreamModule.cs','输入：用户查询 → 逐步推理 → 输出结论链','将合规问题拆解为子问题，依次调用 LLM 得到分步推理，拼接为完整结论'),
      N('ReActSolidModule / ReActStreamModule','推理-行动循环（同步+流式），交替思考与工具调用。','Agent1/Modules/ReActSolidModule.cs / ReActStreamModule.cs','Thought→Action→Observation 循环数据流，通过 ToolService 调度工具','适用需要查表/检索的多步问题，每次 Action 后根据 Observation 决定继续或终止'),
      N('ReflectionModule','自我反思模块，对 AI 结论二次校验与置信度评估。','Agent1/Modules/ReflectionModule.cs','输入：原始结论 → ReflectionVerifier 校验 → 输出修正后的结论+置信度','检测结论中的逻辑矛盾或法规引用错误，触发修正或降级标记'),
      N('RAGModule','检索增强生成，从知识库检索法规后注入 LLM 回答。','Agent1/Modules/RAGModule.cs','查询→向量检索(KnowledgeBaseService)→片段注入 LLM 上下文→生成回答','先用 ChemicalRAG 管道召回相关法规，再让 LLM 基于检索结果作答'),
      N('ComplianceCheckModule','对照国标进行合规性判定与风险等级标注。','Agent1/Modules/ComplianceCheckModule.cs','化学品信息→ComplianceRuleEngine→合规结果+风险等级','调用规则引擎逐条比对法规，输出合规/不合规/需人工复核三级结论'),
      N('EmergencyResponseModule','根据 CAS 号生成泄漏/火灾/爆炸场景处置方案。','Agent1/Modules/EmergencyResponseModule.cs','物质 CAS→EmergencyResponseService→分级处置方案','根据物质特性匹配应急模板，结合现场参数生成具体操作步骤'),
      N('KnowledgeGraphModule','遍历化学品-法规-案例关联关系。','Agent1/Modules/KnowledgeGraphModule.cs','实体查询→KnowledgeGraphService 图遍历→关联结果','查询某化学品关联的所有法规、案例与处置方案，形成关联图谱'),
      N('RegulatoryAuditModule','逐条对照化工条例进行合规审计并输出差距报告。','Agent1/Modules/RegulatoryAuditModule.cs','审计范围→逐条法规比对→差距分析报告','遍历指定法规集，逐一检查企业现状是否符合，生成逐项差距清单'),
      N('TicketFollowupModule','跟踪整改工单状态流转与闭环验证。','Agent1/Modules/TicketFollowupModule.cs','工单 ID→状态机流转→闭环检查→超时预警','按工单生命周期(待办→整改中→待验证→已关闭)驱动状态流转'),

const tabs = document.querySelectorAll('#tabs button');

const popTabs = popup.querySelectorAll('.pop-tabs button');

const INDENT=36, V_GAP=10, TOP_MARGIN=60, LEFT_MARGIN=30;
let scale=1, tx=0, ty=0, currentTab=0, activeNode=null, curPopTab='desc', nodeMap=new Map();
let searchKeyword='', sidebarMode='outline', previewCache=null;

// Helpers
function escHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function isPreviewable(file){
  if(!file||file==='—') return false;
  const f=getFirstFilePath(file);
  return f && !f.includes('*') && !f.endsWith('/') && /\.[a-z]+$/i.test(f);
}
function getFirstFilePath(file){
  let f=file.split(/\s*,\s*|\s+\+\s+|\s+\/\s+/)[0].trim();
  f=f.replace(/\s*\([^)]*\)\s*$/,'').trim();
  return f;
}

function clearAll(){
  mindmap.innerHTML=''; svgEl.innerHTML=''; nodeMap.clear();
  scale=1;tx=0;ty=0; closePopup(); closeCodePanel();
  searchBox.value=''; searchKeyword=''; searchClear.style.display='none';
  previewCache=null;
}

// Build Tree
function buildTree(node, depth){
  const el=document.createElement('div');
  el.className=`node ${depth===0?'root':depth===1?'l1':depth===2?'l2':'l3'}`;
  if(node.desc||node.file) el.classList.add('clickable');
  el.innerHTML=`<div class="node-label">${node.label}</div>`;
  el.style.position='absolute'; el.style.visibility='hidden';
  if(node.children && node.children.length>0){
    const btn=document.createElement('button');
    btn.className='collapse-btn';
    btn.textContent='▼';
    btn.addEventListener('click',e=>{ e.stopPropagation(); toggleCollapse(node); });
    el.appendChild(btn);
  }
  mindmap.appendChild(el);
  node._el=el; node._depth=depth;
  nodeMap.set(node.id||node.label,node);
  if(node.desc||node.file) el.addEventListener('click',e=>{e.stopPropagation();showPopup(node,el);});
  node._children=node.children?node.children.map(c=>buildTree(c,depth+1)):[];
  return node;
}

// Layout
function layoutVertical(node,x,startY){
  const w=node._el.offsetWidth,h=node._el.offsetHeight;
  node._x=x;node._y=startY;node._w=w;node._h=h;
  if(node._collapsed){ node._bottomY=startY+h; return; }
  let nextY=startY+h+V_GAP;
  for(const ch of node._children){ layoutVertical(ch,x+INDENT,nextY); nextY=ch._bottomY+V_GAP; }
  node._bottomY=node._children.length>0?node._children[node._children.length-1]._bottomY:startY+h;
}

// Render
function render(tree){
  for(const [id,node] of nodeMap) node._el.style.visibility='visible';
  layoutVertical(tree,LEFT_MARGIN,TOP_MARGIN);
  for(const [id,node] of nodeMap){ node._el.style.left=node._x+'px'; node._el.style.top=node._y+'px'; }
  let s=''; const C=['#818cf8','#60a5fa','#64748b','#475569'];
  for(const [id,node] of nodeMap){
    if(!node._children||node._children.length===0) continue;
    if(node._collapsed) continue;
    const d=node._depth,lc=C[d]||'#475569',lw=d===0?2.5:d===1?1.8:1;
    const px=node._x+INDENT*0.45,py=node._y+node._h;
    for(const ch of node._children){
      if(ch._el.style.display==='none') continue;
      const cx=ch._x-2,cy=ch._y+ch._h/2,midY=py+(cy-py)*0.55;
      s+=`<path d="M${px},${py} L${px},${midY} L${cx},${midY} L${cx},${cy}" stroke="${lc}" stroke-width="${lw}" fill="none" opacity="0.45"/>`;
    }
  }
  svgEl.innerHTML=s;
  const maxX=Math.max(...[...nodeMap.values()].map(n=>n._x+n._w))+120;
  const maxY=Math.max(...[...nodeMap.values()].map(n=>n._y+n._h))+80;
  svgEl.setAttribute('viewBox',`0 0 ${maxX} ${maxY}`);
  svgEl.style.width=maxX+'px';svgEl.style.height=maxY+'px';
  mindmap.style.width=maxX+'px';mindmap.style.height=maxY+'px';
  if(searchKeyword) doSearchHighlight();
  refreshSidebar();
}

function applyTransform(){
  mindmap.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
  svgEl.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
  svgEl.style.transformOrigin='0 0'; mindmap.style.transformOrigin='0 0';
}

// ===== Collapse =====
function toggleCollapse(node){
  node._collapsed=!node._collapsed;
  const btn=node._el.querySelector('.collapse-btn');
  if(btn) btn.textContent=node._collapsed?'▶':'▼';
  node._el.classList.toggle('collapsed',node._collapsed);
  function hideAll(n){ if(n._children) for(const ch of n._children){ ch._el.style.display='none'; hideAll(ch); } }
  function showVisible(n){ if(n._children) for(const ch of n._children){ ch._el.style.display=''; if(ch._collapsed) hideAll(ch); else showVisible(ch); } }
  if(node._collapsed){ if(node._children) for(const ch of node._children){ ch._el.style.display='none'; hideAll(ch); } }
  else { if(node._children) for(const ch of node._children){ ch._el.style.display=''; showVisible(ch); } }
  render(trees[currentTab]); applyTransform();
}

// ===== Search =====
searchBox.addEventListener('input',()=>{
  searchKeyword=searchBox.value.trim().toLowerCase();
  searchClear.style.display=searchKeyword?'block':'none';
  doSearchHighlight();
});
searchClear.addEventListener('click',()=>{ searchBox.value=''; searchKeyword=''; searchClear.style.display='none'; doSearchHighlight(); });

function doSearchHighlight(){
  if(!searchKeyword){ for(const [id,node] of nodeMap){ node._el.classList.remove('search-hit','search-dim'); } return; }
  for(const [id,node] of nodeMap){
    const match=node.label.toLowerCase().includes(searchKeyword)||(node.desc||'').toLowerCase().includes(searchKeyword)||(node.file||'').toLowerCase().includes(searchKeyword);
    node._el.classList.toggle('search-hit',match);
    node._el.classList.toggle('search-dim',!match);
  }
}

// ===== Sidebar =====
sbToggle.addEventListener('click',()=>{
  const open=sidebar.classList.toggle('open');
  sbToggle.classList.toggle('open',open);
  if(open) refreshSidebar();
});
sbModeSel.addEventListener('change',()=>{ sidebarMode=sbModeSel.value; refreshSidebar(); });

function refreshSidebar(){
  if(!sidebar.classList.contains('open')) return;
  sbTree.innerHTML='';
  if(sidebarMode==='outline') buildOutline(trees[currentTab]);
  else buildFileTree(trees[currentTab]);
}

function buildOutline(node,depth=0){
  const item=document.createElement('div');
  item.className=`sb-item l${Math.min(depth,3)}`;
  const icons=['●','○','▸','·'];
  item.innerHTML=`<span class="sb-icon">${icons[Math.min(depth,3)]}</span>${node.label}`;
  item.addEventListener('click',()=>navigateToNode(node));
  if(activeNode===node) item.classList.add('active');
  sbTree.appendChild(item);
  if(node._children && !node._collapsed) for(const ch of node._children) buildOutline(ch,depth+1);
}

function buildFileTree(rootNode){
  const fileEntries=[];
  function collect(n){
    if(n.file && n.file!=='—'){
      const fp=getFirstFilePath(n.file);
      if(fp && !fp.startsWith('—')) fileEntries.push({path:fp,node:n});
    }
    if(n._children) for(const ch of n._children) collect(ch);
  }
  collect(rootNode);
  
  const rt={name:'',children:{},files:[]};
  for(const e of fileEntries){
    const parts=e.path.replace(/\\/g,'/').split('/').filter(p=>p);
    if(parts.length===0) continue;
    let cur=rt;
    for(let i=0;i<parts.length-1;i++){
      if(!cur.children[parts[i]]) cur.children[parts[i]]={name:parts[i],children:{},files:[]};
      cur=cur.children[parts[i]];
    }
    const ln=parts[parts.length-1];
    if(ln) cur.files.push({name:ln,node:e.node});
  }
  
  function renderFs(fs,depth,containerEl){
    const dirs=Object.keys(fs.children).sort();
    for(const dn of dirs){
      const child=fs.children[dn];
      const dd=document.createElement('div');
      dd.className='ft-dir'; dd.style.paddingLeft=(12+depth*14)+'px';
      dd.innerHTML=`<span class="ft-arrow">▶</span>📁 ${dn}`;
      const cd=document.createElement('div'); cd.className='ft-children';
      dd.addEventListener('click',e=>{
        e.stopPropagation();
        const io=cd.classList.toggle('open');
        dd.classList.toggle('open',io);
        const ar=dd.querySelector('.ft-arrow');
        if(ar) ar.textContent=io?'▼':'▶';
      });
      containerEl.appendChild(dd); containerEl.appendChild(cd);
      renderFs(child,depth+1,cd);
    }
    for(const f of fs.files){
      const fd=document.createElement('div');
      fd.className='ft-file'; fd.style.paddingLeft=(24+depth*14)+'px';
      fd.textContent='📄 '+f.name;
      fd.addEventListener('click',e=>{e.stopPropagation();navigateToNode(f.node);showPopup(f.node,f.node._el);});
      containerEl.appendChild(fd);
    }
  }
  renderFs(rt,0,sbTree);
}

function navigateToNode(node){
  if(!node||!node._el) return;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  const cr=container.getBoundingClientRect();
  tx=cr.width/2-(node._x+node._w/2)*scale;
  ty=cr.height/2-(node._y+node._h/2)*scale;
  applyTransform();
  node._el.classList.add('active');
  setTimeout(()=>{if(activeNode!==node)node._el.classList.remove('active');},1500);
}

// ===== Popup =====
function buildPopupContent(node){
  const desc=node.desc||'暂无说明';
  const file=node.file||'—';
  const dl=node.dataLogic||'—';
  const bl=node.bizLogic||'—';
  return {
    desc: `<div class="pop-title">${node.label}</div><div class="pop-desc">${desc}</div>`,
    code: `<div class="pop-title">${node.label}</div>
      <div class="code-section"><div class="code-label">📁 核心文件</div><div class="code-value">${file}</div></div>
      <div class="code-section"><div class="code-label">📊 数据逻辑</div><div class="logic-text">${dl}</div></div>
      <div class="code-section"><div class="code-label">⚙️ 业务逻辑</div><div class="logic-text">${bl}</div></div>`
  };
}

function showPopup(node,el){
  closeCodePanel();
  if(activeNode) activeNode._el.classList.remove('active');
  activeNode=node; el.classList.add('active');
  curPopTab='desc';
  popTabs.forEach(b=>b.classList.toggle('active',b.dataset.ptab==='desc'));
  const previewTab=popup.querySelector('[data-ptab="preview"]');
  if(previewTab) previewTab.style.display=isPreviewable(node.file)?'':'none';
  const content=buildPopupContent(node);
  popBody.innerHTML=content.desc;
  previewCache=null;
  popup.style.display='block'; backdrop.style.display='block';
  const rect=el.getBoundingClientRect();
  let left=rect.right+12, top=rect.top;
  if(left+400>window.innerWidth) left=rect.left-416;
  if(top+300>window.innerHeight) top=window.innerHeight-320;
  if(top<60) top=60;
  popup.style.left=left+'px'; popup.style.top=top+'px';
}

function closePopup(){
  if(activeNode){ activeNode._el.classList.remove('active'); activeNode=null; }
  popup.style.display='none'; backdrop.style.display='none';
  previewCache=null;
}

popTabs.forEach(btn=>{ btn.addEventListener('click',e=>{
  e.stopPropagation();
  if(!activeNode) return;
  const newTab=btn.dataset.ptab;
  if(newTab==='preview'){ const n=activeNode; closePopup(); openCodePanel(n); return; }
  curPopTab=newTab;
  popTabs.forEach(b=>b.classList.toggle('active',b.dataset.ptab===curPopTab));
  const content=buildPopupContent(activeNode);
  popBody.innerHTML=curPopTab==='desc'?content.desc:content.code;
});});

// ===== Code Panel =====
function openCodePanel(node){
  cpTitle.textContent='📄 '+node.label;
  cpMeta.textContent='加载中...';
  cpBody.innerHTML='<div class="cp-loading">⏳ 加载文件中...</div>';
  codePanel.classList.add('open');
  const fp=getFirstFilePath(node.file);
  fetch(fp).then(resp=>{
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    return resp.text();
  }).then(text=>{
    const lines=text.split('\n');
    cpMeta.textContent=lines.length+' 行';
    let html='<pre>';
    for(let i=0;i<lines.length;i++){
      html+=`<span class="cp-line"><span class="cp-ln">${i+1}</span>${escHtml(lines[i])}</span>\n`;
    }
    html+='</pre>';
    cpBody.innerHTML=html;
  }).catch(e=>{
    cpBody.innerHTML=`<div class="cp-error">⚠️ 无法加载文件<br><small style="color:#64748b">${escHtml(fp)}</small></div>`;
  });
}

function closeCodePanel(){
  codePanel.classList.remove('open');
  codePanel.style.width=''; codePanel.style.transition='width .3s ease';
}

cpClose.addEventListener('click',closeCodePanel);

// Resize handle
let resizing=false,rsX,rsW;
cpResize.addEventListener('mousedown',e=>{ resizing=true; rsX=e.clientX; rsW=codePanel.offsetWidth; e.preventDefault(); });
window.addEventListener('mousemove',e=>{
  if(!resizing) return;
  const nw=Math.max(320,Math.min(window.innerWidth*0.72,rsW+(rsX-e.clientX)));
  codePanel.style.width=nw+'px'; codePanel.style.transition='none';
});
window.addEventListener('mouseup',()=>{ if(resizing){ resizing=false; codePanel.style.transition='width .3s ease'; } });

// ===== Interaction =====
backdrop.addEventListener('click',closePopup);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){ closePopup(); closeCodePanel(); }});

container.addEventListener('mousedown',e=>{ isDragging=true; startX=e.clientX; startY=e.clientY; startTx=tx; startTy=ty; });
window.addEventListener('mousemove',e=>{ if(!isDragging) return; tx=startTx+(e.clientX-startX); ty=startTy+(e.clientY-startY); applyTransform(); });
window.addEventListener('mouseup',()=>{ isDragging=false; });
container.addEventListener('wheel',e=>{
  e.preventDefault();
  const ds=e.deltaY>0?0.92:1.08,ns=Math.min(3,Math.max(0.12,scale*ds));
  const rect=container.getBoundingClientRect();
  tx=e.clientX-rect.left-(e.clientX-rect.left-tx)*(ns/scale);
  ty=e.clientY-rect.top-(e.clientY-rect.top-ty)*(ns/scale);
  scale=ns; applyTransform();
},{passive:false});

let isDragging=false,startX,startY,startTx,startTy;

// ===== Tab Loading =====
function loadTab(idx){
  currentTab=idx;
  tabs.forEach((b,i)=>b.classList.toggle('active',i===idx));
  clearAll();
  buildTree(trees[idx],0);
  setTimeout(()=>{ render(trees[idx]); tx=30;ty=20;scale=0.9; applyTransform(); },120);
}

tabs.forEach(btn=>{ btn.addEventListener('click',()=>loadTab(parseInt(btn.dataset.tab))); });
window.addEventListener('resize',()=>{ render(trees[currentTab]); applyTransform(); });
loadTab(0);
</script>
</body>
</html>
