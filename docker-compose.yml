# ==========================================
# AgentSystem - Docker Compose 配置
# 一键启动 PostgreSQL 16 + pgvector + Ollama + API 服务
# ==========================================
# 使用方式：
#   1. cp .env.example .env        （首次或根据需要修改密码）
#   2. docker-compose up -d        （启动全部服务，首次自动拉取模型）
#   3. docker-compose logs -f api  （查看 API 日志）
#   4. docker-compose down         （停止全部服务）
# ==========================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chemical_agent_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-chemical_park_ai_agent}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
    volumes:
      # 数据持久化（容器重启不丢失数据）
      - postgres_data:/var/lib/postgresql/data
      # 启动时自动执行建表脚本
      - ./init_database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-chemical_park_ai_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Ollama 本地 LLM 推理服务 ──
  ollama:
    image: ollama/ollama:latest
    container_name: chemical_agent_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # GPU 加速（NVIDIA GPU，取消注释启用）:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── 模型自动拉取（首次启动完成后退出）──
  ollama-pull:
    image: ollama/ollama:latest
    container_name: chemical_agent_ollama_pull
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[ollama-pull] Waiting for Ollama server..."
        until ollama list > /dev/null 2>&1; do sleep 2; done
        echo "[ollama-pull] Ollama ready, pulling qwen3:8b (~4.7GB)..."
        ollama pull qwen3:8b
        echo "[ollama-pull] Pulling nomic-embed-text (~274MB)..."
        ollama pull nomic-embed-text
        echo "[ollama-pull] All models pulled successfully"
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chemical_agent_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-chemical_park_ai_agent}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
      - JWT_KEY=${JWT_KEY:-}
      - AUTH_ACCOUNTS_JSON=${AUTH_ACCOUNTS_JSON}
      - LLM__Endpoint=http://ollama:11434
      - KnowledgeBase__BasePath=/app/knowledgebase
    volumes:
      # 日志持久化
      - api_logs:/app/logs
      # 知识库只读挂载
      - ./knowledgebase:/app/knowledgebase:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
    name: chemical_agent_postgres_data
  api_logs:
    name: chemical_agent_api_logs
  ollama_data:
    name: chemical_agent_ollama_data
