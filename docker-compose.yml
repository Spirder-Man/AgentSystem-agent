# ==========================================
# Agent1 - 化工合规 AI 平台生产级容器编排
# 一键启动: PostgreSQL + Ollama(LLM+Embedding) + API + Prometheus + Grafana
# ==========================================
# 使用方式:
#   1. cp .env.example .env        （首次或根据需要修改密码）
#   2. bash scripts/docker-up.sh   （一键启动）
#   或 docker-compose up -d         （直接启动）
#   3. docker-compose logs -f api   （查看 API 日志）
#   4. docker-compose down          （停止全部服务）
# ==========================================

services:
  # ═══════════════════════════════════════
  # PostgreSQL 16 + pgvector 向量扩展
  # ═══════════════════════════════════════
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent1_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-chemical_park_ai_agent}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-chemical_park_ai_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent1_net

  # ═══════════════════════════════════════
  # llama.cpp LLM 推理服务 (OpenAI 兼容 :8080/v1)
  # 替代 Ollama，与项目实际 Linux 部署架构一致
  # ═══════════════════════════════════════
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama
    image: agent1-llama-cuda:latest
    container_name: agent1_llama
    restart: unless-stopped
    ports:
      - "${LLAMA_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
    command:
      - "-m"
      - "/models/qwen3-8b-q4_k_m.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "99"
      - "-c"
      - "4096"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - agent1_net
    # GPU 加速 (NVIDIA GPU — 取消注释启用):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ═══════════════════════════════════════
  # llama.cpp Embedding 服务 (:8081/v1)
  # ═══════════════════════════════════════
  llama-embed:
    build:
      context: .
      dockerfile: Dockerfile.llama
    image: agent1-llama-cuda:latest
    container_name: agent1_llama_embed
    restart: unless-stopped
    ports:
      - "${LLAMA_EMBED_PORT:-8081}:8081"
    volumes:
      - ./models:/models:ro
    command:
      - "-m"
      - "/models/nomic-embed-text-v1.5.Q8_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "--embeddings"
      - "-ngl"
      - "99"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - agent1_net
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ═══════════════════════════════════════
  # Agent1 API 服务
  # ═══════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent1_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # ── 运行时 ──
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # ── 数据库 ──
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-chemical_park_ai_agent}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
      # ── JWT ──
      - JWT_KEY=${JWT_KEY:?生产环境必须设置 JWT_KEY}
      # ── 账号 ──
      - AUTH_ACCOUNTS_JSON=${AUTH_ACCOUNTS_JSON:-[]}
      # ── LLM 端点 (P0-2: 环境变量覆盖 appsettings.json 默认值) ──
      - LLM_ENDPOINT=http://llama-server:8080/v1
      # ── Embedding 端点 ──
      - VectorSearch__EmbeddingEndpoint=http://llama-embed:8081/v1
      # ── 知识库路径 (P0-1: 跨平台路径) ──
      - KNOWLEDGE_BASE_PATH=/app/knowledgebase
      # ── 告警邮件 (P1: SMTP) ──
      - ALERT_EMAIL_PASSWORD=${ALERT_EMAIL_PASSWORD:-}
      - ALERT_RECIPIENT_EMAILS=${ALERT_RECIPIENT_EMAILS:-}
      # ── 可观测性 ──
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
    volumes:
      - api_logs:/app/logs
      - ./knowledgebase:/app/knowledgebase:ro
    depends_on:
      postgres:
        condition: service_healthy
      llama-server:
        condition: service_healthy
      llama-embed:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - agent1_net

  # ═══════════════════════════════════════
  # Prometheus — 指标采集 + 告警规则
  # ═══════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: agent1_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent1_net

  # ═══════════════════════════════════════
  # Grafana — 可视化仪表盘
  # ═══════════════════════════════════════
  grafana:
    image: grafana/grafana:10.4.5
    container_name: agent1_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-agent1-admin}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboard.json:/etc/grafana/provisioning/dashboards/agent1-slo.json:ro
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/dashboard-provider.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent1_net

# ═══════════════════════════════════════
# 持久化卷
# ═══════════════════════════════════════
volumes:
  postgres_data:
    name: agent1_postgres_data
  api_logs:
    name: agent1_api_logs
  prometheus_data:
    name: agent1_prometheus_data
  grafana_data:
    name: agent1_grafana_data

# ═══════════════════════════════════════
# 内部网络 (容器间通信)
# ═══════════════════════════════════════
networks:
  agent1_net:
    name: agent1_net
    driver: bridge
