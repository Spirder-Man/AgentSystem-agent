<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent1 系统关系图 · 类与业务链路</title>
<style>
:root{
  --bg:#f3f5fa; --panel:#ffffff; --border:#dbe1ec; --text:#232b3a; --muted:#6a7690;
  --heart:#d97706; --artery:#2563eb; --vein:#0f766e; --shared:#7c3aed;
  --head-h:52px; --drawer-w:440px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
svg.vi{display:inline-block;vertical-align:-2px;flex:none;pointer-events:none}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;font-size:14px}

/* ── 顶栏 ── */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--head-h);z-index:50;
  display:flex;align-items:center;gap:12px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--border);
  box-shadow:0 1px 8px rgba(35,43,58,0.05);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--heart);box-shadow:0 0 0 3px rgba(217,119,6,0.15)}
.stats{font-size:11px;color:var(--muted);white-space:nowrap;border-left:1px solid var(--border);padding-left:12px}
.stats b{color:var(--text)}
.search-box{flex:1;max-width:360px;display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 8px;height:32px}
.search-box input{border:none;outline:none;background:transparent;flex:1;font-size:13px;color:var(--text);min-width:0}
.search-box button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px}
.search-count{font-size:11px;color:var(--muted);background:var(--bg);border-radius:10px;padding:2px 8px;display:none}
.chains{display:flex;gap:6px;overflow-x:auto;max-width:48vw;scrollbar-width:none}
.chains::-webkit-scrollbar{display:none}
.chain-chip{
  border:1px solid var(--border);background:var(--panel);color:var(--muted);
  border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap;
  transition:all .18s;
}
.chain-chip:hover{border-color:#94a3b8;color:var(--text)}
.chain-chip.on{color:#fff;border-color:transparent;font-weight:700}
.tools{display:flex;gap:6px;margin-left:auto}
.tools button{
  height:32px;min-width:32px;padding:0 10px;border:1px solid var(--border);border-radius:8px;
  background:var(--panel);color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s;
}
.tools button:hover{border-color:#94a3b8;color:var(--text);background:var(--bg)}

/* ── 画布 ── */
main{position:fixed;top:var(--head-h);left:0;right:0;bottom:0}
#diagram{width:100%;height:100%;display:block;cursor:grab;background:
  radial-gradient(circle at 50% 0%, #ffffff 0%, var(--bg) 70%)}
svg.dragging{cursor:grabbing}
#world{transform-origin:0 0}
.row-label{font-size:11px;font-weight:700;fill:#9aa4ba;letter-spacing:1px}
.row-line{stroke:#e3e8f2;stroke-width:1;stroke-dasharray:2 4}
.col-body{fill:rgba(255,255,255,0.55);stroke:#dbe1ec;stroke-width:1;rx:12}
.col-head{cursor:pointer}
.col-head rect{fill:#3b465c;rx:10;transition:fill .15s}
.col-head:hover rect{filter:brightness(1.08)}
.col-head .t1{fill:#fff;font-size:13px;font-weight:800}
.col-head .t2{fill:rgba(255,255,255,0.75);font-size:10px}
.col-head .cnt{fill:rgba(255,255,255,0.9);font-size:10px;font-weight:700}
.collapse-btn{cursor:pointer;fill:rgba(255,255,255,0.9);font-size:13px;font-weight:800}
.node{cursor:pointer}
.node rect{fill:#fff;stroke:#c9d2e1;stroke-width:1;rx:7;transition:all .12s}
.node:hover rect{stroke:#64748b;stroke-width:1.5}
.node.shared rect{stroke-dasharray:5 3;stroke:var(--shared);fill:#fbfaff}
.node .nm{font-size:11px;font-weight:700;fill:#26303f}
.node .bd{font-size:8.5px;font-weight:700;fill:#fff;text-anchor:middle}
.node .sb{font-size:8.5px;fill:var(--muted)}
.node.chain-node rect{stroke-width:2}
.node.chain-node .nm{font-weight:800}
.dep-edge{fill:none;stroke:#8fa0ba;stroke-width:1.2;opacity:0.28;cursor:pointer}
.dep-edge:hover{opacity:0.85;stroke-width:2}
.ext-edge{fill:none;stroke:#8b9bb5;stroke-width:1;stroke-dasharray:5 5;opacity:0.3}
.ext-box{cursor:pointer}
.ext-box rect{fill:#fff;stroke:#b6bdd0;stroke-width:1;stroke-dasharray:4 3;rx:9;transition:all .12s}
.ext-box:hover rect{stroke:var(--shared);stroke-width:1.5}
.ext-box .en{font-size:10.5px;font-weight:800;fill:#3d4759;text-anchor:middle}
.ext-box .ed{font-size:8.5px;fill:var(--muted);text-anchor:middle}
.ext-tag{font-size:9px;font-weight:800;fill:#8b5cf6;text-anchor:middle}
.chain-path{fill:none;stroke-width:2.4;stroke-dasharray:7 5;opacity:0.9}
.chain-node .ring{stroke-width:2}
.chain-node .num{fill:#fff;font-size:11px;font-weight:800;text-anchor:middle}
.chain-node.hl rect{filter:drop-shadow(0 2px 6px rgba(0,0,0,0.25))}
.world-dim .node:not(.chain-node),.world-dim .col-head,.world-dim .ext-box,.world-dim .dep-edge{opacity:0.12}
.world-dim .row-label{opacity:0.3}
.world-dim .col-body{opacity:0.25}
.world-dim .chain-node,.world-dim .chain-path{opacity:1}
.search-dim .node:not(.match){opacity:0.08}
.search-dim .dep-edge,.search-dim .ext-edge{opacity:0.04}
.search-dim .col-body{opacity:0.25}
.node.match rect{stroke:#f59e0b;stroke-width:2.5}
.node.hovered rect{stroke:#475569;stroke-width:2}
.col-glow rect{filter:brightness(1.12)}
.placeholder{font-size:10px;fill:var(--muted)}
.placeholder a{cursor:pointer;fill:var(--shared);font-weight:700}

/* ── 图例 ── */
.legend{
  position:fixed;left:14px;bottom:14px;z-index:30;background:rgba(255,255,255,0.94);
  border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:11px;color:var(--muted);
  box-shadow:0 4px 18px rgba(35,43,58,0.08);max-width:330px;line-height:1.7;
}
.legend b{color:var(--text)}
.legend .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ── 详情抽屉 ── */
.drawer{
  position:fixed;top:var(--head-h);right:0;bottom:0;width:var(--drawer-w);z-index:40;
  background:var(--panel);border-left:1px solid var(--border);box-shadow:-6px 0 24px rgba(35,43,58,0.10);
  transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.drawer-head .icon{font-size:22px;line-height:1.2}
.drawer-head .tt{font-size:15px;font-weight:800;line-height:1.3}
.drawer-head .st{font-size:11px;color:var(--muted);margin-top:3px}
.drawer-close{margin-left:auto;border:none;background:var(--bg);color:var(--muted);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;flex:none}
.drawer-body{flex:1;overflow-y:auto;padding:14px 18px 30px}
.sec{margin-bottom:16px}
.sec h4{font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:8px;font-weight:800}
.node-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:10px;font-weight:800;border-radius:6px;padding:2px 8px;color:#fff}
.path-row{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 8px}
.path-row code{font-size:11px;color:#3b475e;word-break:break-all;flex:1}
.path-row button{border:none;background:var(--panel);border:1px solid var(--border);border-radius:5px;font-size:10px;color:var(--muted);cursor:pointer;padding:3px 8px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;border-radius:12px;padding:3px 10px;background:var(--bg);border:1px solid var(--border);color:#475467;cursor:pointer;transition:all .12s}
.chip:hover{border-color:#94a3b8}
.chip.up{background:#eef6ff;border-color:#bcd8ff;color:#1e5bb8}
.chip.down{background:#ecfdf5;border-color:#b7ecd5;color:#0f766e}
.flow-item{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed #eef1f7}
.flow-item:last-child{border-bottom:none}
.flow-num{flex:none;width:18px;height:18px;border-radius:50%;background:#eef1f7;color:var(--muted);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.flow-tx{font-size:12px;line-height:1.5}
.flow-tx b{font-size:12px;display:block}
.flow-tx span{color:var(--muted);font-size:11px}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.6;margin-bottom:6px}
.file-line{display:flex;align-items:center;gap:6px;font-size:11px;padding:4px 0;color:#3b475e;cursor:pointer}
.file-line:hover{color:var(--heart)}
.dep-line{font-size:11px;color:var(--muted);margin-top:2px}

/* ── 悬浮提示 ── */
#tooltip{
  position:fixed;z-index:60;max-width:360px;background:#1e293b;color:#e2e8f0;
  border-radius:8px;padding:8px 11px;font-size:11px;line-height:1.5;pointer-events:none;
  opacity:0;transition:opacity .12s;box-shadow:0 6px 20px rgba(0,0,0,0.25);white-space:normal;
}
#tooltip.show{opacity:1}
#tooltip b{color:#fff;font-size:12px}

/* ── 日志追踪弹窗 ── */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:70;display:none;align-items:center;justify-content:center}
.modal-mask.open{display:flex}
#code-mask, #manual-mask{pointer-events:none}
#code-mask .modal, #manual-mask .modal{pointer-events:auto}
.modal{width:min(680px,92vw);max-height:80vh;background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head b{font-size:14px}
.modal-head button{border:none;background:var(--bg);width:26px;height:26px;border-radius:6px;cursor:pointer;color:var(--muted)}
.modal-body{padding:14px 18px;overflow-y:auto}
.modal-body textarea{width:100%;height:150px;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;font-family:Consolas,monospace;resize:vertical;outline:none}
.modal-actions{display:flex;gap:8px;margin-top:10px}
.modal-actions button{border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:7px 14px;font-size:12px;cursor:pointer;color:var(--text)}
.modal-actions button.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.trace-res{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.trace-res .hit{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 8px;border-radius:6px;background:var(--bg);cursor:pointer}
.trace-res .hit:hover{background:#eef2ff}
.trace-res .hit code{color:#475569;font-size:11px}
.empty-tip{font-size:12px;color:var(--muted);text-align:center;padding:20px}
</style>
<style id="dark-theme">

/* 列 */
.col-body{fill:rgba(16,28,60,0.32);stroke:rgba(148,180,255,0.16);rx:14}
.col-head rect{rx:12;filter:saturate(0.88) drop-shadow(0 6px 16px rgba(0,0,0,0.55))}
.col-head:hover rect{filter:brightness(1.12) saturate(1.02) drop-shadow(0 0 16px rgba(255,255,255,0.10))}

/* 节点：暗色玻璃卡片 */
.node rect{

}

.modal-head{border-bottom:1px solid var(--border)}
.modal-head button{background:rgba(255,255,255,0.07);color:var(--muted)}
.modal-body textarea{background:rgba(2,6,16,0.75);border:1px solid var(--border);color:#cfe0ff}
.modal-body textarea:focus{border-color:var(--border-strong);outline:none}
.modal-actions button{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text)}
.modal-actions button:hover{border-color:var(--border-strong)}
.modal-actions button.primary{background:linear-gradient(135deg,#4f46e5,#8b5cf6);border:none;box-shadow:0 0 18px rgba(139,92,246,0.45)}
.trace-res .hit{background:rgba(255,255,255,0.04)}
.trace-res .hit:hover{background:rgba(99,102,241,0.16)}
.trace-res .hit code{color:#8fa3cc}
.empty-tip{color:var(--muted)}
.code-actions{display:flex;gap:8px;margin-top:10px}
.code-btn{
  flex:1;border:1px solid rgba(99,102,241,0.45);background:rgba(99,102,241,0.12);color:#c7d2fe;
  border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;text-align:center;text-decoration:none;
  transition:all .15s;
}
.code-btn:hover{background:rgba(99,102,241,0.26);border-color:#818cf8}
.code-btn.ghost{background:rgba(255,255,255,0.05);border-color:var(--border);color:var(--muted)}
.code-btn.ghost:hover{color:var(--text);border-color:var(--border-strong)}
.modal-code{width:min(1080px,94vw);height:min(82vh,760px)}
.code-body{padding:0;display:flex;flex-direction:column;overflow:hidden}
#code-status{padding:10px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
#code-view{
  flex:1;overflow:auto;margin:0;padding:14px 16px;font-family:Consolas,'Courier New',monospace;
  font-size:12px;line-height:1.55;color:#cfe0ff;white-space:pre;background:rgba(2,6,16,0.72);
}
.ln{display:inline-block;width:46px;color:#4a5a85;user-select:none;text-align:right;margin-right:16px}
/* ── 关系小图（左上角） ── */
.minimap{
  position:fixed;top:calc(var(--head-h) + 52px);left:12px;z-index:35;
  width:min(400px,92vw);max-height:52vh;display:none;flex-direction:column;
  background:rgba(8,13,30,0.92);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 14px 44px rgba(0,0,0,0.55);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);overflow:hidden;
}
.minimap.open{display:flex}
.mm-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border)}
.mm-head b{font-size:12px;color:var(--text);white-space:nowrap}
.mm-tabs{display:flex;gap:4px;margin-left:auto}
.mm-tab{border:1px solid transparent;background:transparent;color:var(--muted);font-size:11px;padding:3px 9px;border-radius:7px;cursor:pointer}
.mm-tab.on{background:rgba(99,102,241,0.18);color:#c7d2fe;border-color:rgba(99,102,241,0.35)}
#mm-close{border:none;background:rgba(255,255,255,0.06);color:var(--muted);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:11px;flex:none}
.mm-body{overflow:auto;padding:10px 12px 12px}
.mm-svg{width:100%;height:auto;display:block}
.mm-node{cursor:pointer}
.mm-node rect{fill:rgba(20,32,66,0.9);stroke:rgba(140,170,255,0.35);rx:6}
.mm-node:hover rect{stroke:#fbbf24;stroke-width:1.5}
.mm-node .t{font-size:9.5px;fill:#dbe4ff;font-weight:700}
.mm-node .role{font-size:8px;fill:var(--muted)}
.mm-center rect{fill:rgba(245,158,11,0.14);stroke:#f59e0b;stroke-width:1.4}
.mm-center .t{fill:#fde68a;font-size:10px;font-weight:800}
.mm-edge{fill:none;stroke:rgba(148,180,255,0.45);stroke-width:1;opacity:0.7}
.mm-arrow{fill:rgba(148,180,255,0.7)}
.mm-label{font-size:9px;fill:#8fa3cc}
.mm-call{margin-bottom:7px;border:1px solid rgba(130,160,255,0.12);border-radius:8px;padding:6px 8px;background:rgba(255,255,255,0.025)}
.mm-call b{font-size:10.5px;color:#dbe4ff;font-family:Consolas,monospace}
.mm-call .cnt{font-size:9px;color:var(--muted);margin-left:6px}
.mm-callers{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.mm-caller{font-size:9.5px;border-radius:9px;padding:2px 7px;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.28);color:#c7d2fe;cursor:pointer}
.mm-caller:hover{background:rgba(99,102,241,0.28)}
.mm-empty{font-size:10.5px;color:var(--muted);padding:14px 6px;line-height:1.6}
.mm-more{font-size:9px;color:#8fa3cc}
/* ── 代码查看：链路导航 + 方法高亮 ── */
.code-chainbar{
  display:none;padding:8px 14px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,0.02);font-size:11px;color:var(--muted);
}
.cb-chain{color:#fbbf24;font-weight:800;margin-right:8px}
.cb-step{color:var(--muted);margin-right:10px}
.cb-nav{
  border:1px solid rgba(99,102,241,0.40);background:rgba(99,102,241,0.12);color:#c7d2fe;
  border-radius:7px;padding:3px 9px;font-size:10.5px;cursor:pointer;margin-right:6px;
}
.cb-nav:hover{background:rgba(99,102,241,0.28)}
.cb-methods{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cb-method{
  font-size:10px;font-family:Consolas,monospace;border-radius:8px;padding:2px 8px;
  background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.35);color:#6ee7b7;cursor:pointer;
}
.cb-method:hover{background:rgba(52,211,153,0.25)}
.cb-method2{background:rgba(56,189,248,0.12);border-color:rgba(56,189,248,0.35);color:#7dd3fc}
.cb-method2:hover{background:rgba(56,189,248,0.25)}
.cb-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);cursor:pointer;white-space:nowrap}
.cb-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.cb-neighbors{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-bottom:6px;font-size:10px}
.cb-dir{font-weight:800}
.cb-dir.up{color:#7dd3fc}
.cb-dir.down{color:#6ee7b7}
.cb-nb{
  border:1px solid rgba(130,160,255,0.28);background:rgba(130,160,255,0.08);color:#c7d2fe;
  border-radius:7px;padding:2px 7px;font-size:10px;cursor:pointer;
}
.cb-nb:hover{background:rgba(130,160,255,0.20);color:#fff}
.cb-nb.down{border-color:rgba(52,211,153,0.30);background:rgba(52,211,153,0.08);color:#6ee7b7}
.cb-nb.down:hover{background:rgba(52,211,153,0.20);color:#fff}
.cb-me{
  font-weight:800;color:#fbbf24;border:1px solid rgba(245,158,11,0.35);
  background:rgba(245,158,11,0.10);border-radius:7px;padding:2px 8px;
}
.code-line{white-space:pre;display:block}
.code-line.fn-line{background:rgba(130,160,255,0.05)}
.code-line.chain-fn{background:rgba(52,211,153,0.13);box-shadow:inset 3px 0 0 #34d399}
.code-line.chain-fn2{background:rgba(56,189,248,0.10);box-shadow:inset 3px 0 0 #38bdf8}
.code-line.dim{opacity:0.20}
.code-line.method-focus{background:rgba(245,158,11,0.16)}
.mm-nav{display:flex;gap:8px;margin-top:8px}
.mm-nav button{
  flex:1;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--muted);
  border-radius:7px;padding:5px 8px;font-size:10.5px;cursor:pointer;
}
.mm-nav button:hover{color:var(--text);border-color:var(--border-strong)}
.mm-goto{
  font-size:9.5px;color:#7dd3fc;cursor:pointer;margin-left:8px;
  border:1px solid rgba(56,189,248,0.30);border-radius:6px;padding:1px 6px;background:rgba(56,189,248,0.08);
}
.mm-goto:hover{background:rgba(56,189,248,0.20)}
.mm-out{font-size:9.5px;color:#6ee7b7;margin-left:8px;border:1px solid rgba(52,211,153,0.30);border-radius:6px;padding:1px 6px;background:rgba(52,211,153,0.08)}
.mm-outers{margin-top:5px}
.mm-callee{background:rgba(56,189,248,0.10);border-color:rgba(56,189,248,0.28);color:#7dd3fc}
.mm-callee:hover{background:rgba(56,189,248,0.24)}
/* ── 顶部下拉菜单 ── */
.menu{position:relative}
.menu-btn{
  display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;
  border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,0.05);
  color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;
}
.menu-btn:hover{color:var(--text);border-color:var(--border-strong);background:rgba(255,255,255,0.09)}
.menu-panel{
  display:none;position:absolute;top:calc(100% + 8px);left:0;min-width:280px;max-height:72vh;
  overflow-y:auto;background:rgba(9,14,32,0.97);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 18px 50px rgba(0,0,0,0.55);backdrop-filter:blur(16px);padding:6px;z-index:60;
}
.menu.open .menu-panel{display:block}
.menu-item{
  display:block;width:100%;text-align:left;border:none;background:transparent;color:#b9c6ea;
  font-size:12px;padding:8px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;
}
.menu-item:hover{background:rgba(255,255,255,0.08);color:#fff}
.menu-item.on{background:rgba(99,102,241,0.18);color:#fff;font-weight:700}
.menu-item .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.menu-sep{height:1px;background:var(--border);margin:5px 8px}
/* ── 主流程导航条（驾驶舱） ── */
.flowbar{
  position:fixed;top:var(--head-h);left:0;right:0;height:42px;z-index:44;
  display:flex;align-items:center;gap:4px;padding:0 14px;overflow-x:auto;
  background:rgba(6,10,24,0.80);border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);scrollbar-width:none;
}
.flowbar::-webkit-scrollbar{display:none}
.flow-item{
  flex:none;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--muted);
  border-radius:15px;padding:4px 12px;font-size:11.5px;cursor:pointer;white-space:nowrap;transition:all .15s;
}
.flow-item:hover{color:var(--text);border-color:var(--border-strong);background:rgba(255,255,255,0.08)}
.flow-item.on{background:rgba(99,102,241,0.22);border-color:rgba(129,140,248,0.6);color:#fff;font-weight:700}
.flow-item.global{border-style:dashed}
.flow-arrow{flex:none;color:#55648a;font-size:11px;padding:0 1px;user-select:none}
.flowbar .flow-hint{flex:none;font-size:10.5px;color:#55648a;margin-right:4px;white-space:nowrap}
/* ── 模块使用手册 ── */
.modal-manual{width:min(1120px,95vw);height:min(84vh,780px);display:flex;flex-direction:column;overflow:hidden}
.manual-body{flex:1;display:flex;overflow:hidden;min-height:0}
.manual-nav{width:200px;flex:none;border-right:1px solid var(--border);overflow-y:auto;padding:10px}
.manual-item{
  display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;
  color:#b9c6ea;font-size:12px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px;
}
.manual-item:hover{background:rgba(255,255,255,0.07);color:#fff}
.manual-item.on{background:rgba(99,102,241,0.18);border-color:rgba(129,140,248,0.45);color:#fff;font-weight:700}
.manual-content{flex:1;overflow-y:auto;padding:16px 22px;min-width:0}
.manual-content h2{font-size:16px;color:var(--text);margin-bottom:4px}
.manual-content .m-role{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:14px}
.manual-content h4{font-size:11px;letter-spacing:1px;color:var(--muted);margin:14px 0 8px;font-weight:800;border-bottom:1px solid rgba(130,160,255,0.12);padding-bottom:4px}
.m-block{background:rgba(255,255,255,0.03);border:1px solid rgba(130,160,255,0.12);border-radius:9px;padding:8px 12px;margin-bottom:6px;font-size:12px;color:#c7d2fe;line-height:1.6}
.m-block code{color:#7dd3fc;font-family:Consolas,monospace;font-size:11px}
.m-block .m-k{color:#6ee7b7;font-weight:700;margin-right:6px}
.m-block .m-file{display:block;font-size:10.5px;color:#8fa3cc;margin-top:3px}
.m-empty{font-size:11.5px;color:#8fa3cc;padding:8px 2px}
.manual-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--border)}
.manual-foot button{border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--muted);border-radius:8px;padding:6px 16px;font-size:12px;cursor:pointer}
.manual-foot button:hover{color:var(--text);border-color:var(--border-strong)}
.manual-index{font-size:11px;color:var(--muted)}
.m-sec-desc{font-size:11px;color:#7d90bd;line-height:1.6;margin-bottom:8px}
.m-block.clickable{cursor:pointer;transition:all .15s}
.m-block.clickable:hover{border-color:rgba(129,140,248,0.5);background:rgba(99,102,241,0.10)}
.m-exp{display:block;font-size:10px;color:#7d90bd;margin-top:4px}
.m-methods{border:1px solid rgba(130,160,255,0.12);border-radius:9px;padding:8px 12px;margin-bottom:6px;background:rgba(255,255,255,0.02)}
.m-methods .m-file{display:block;font-size:11px;color:#c7d2fe;font-weight:700;margin-bottom:6px}
.m-method-list{display:flex;flex-wrap:wrap;gap:5px}
.m-method{
  font-size:10.5px;font-family:Consolas,monospace;border:1px solid rgba(56,189,248,0.30);
  background:rgba(56,189,248,0.08);color:#7dd3fc;border-radius:7px;padding:2px 8px;cursor:pointer;
}
.m-method:hover{background:rgba(56,189,248,0.22);color:#fff}
.m-more{font-size:10px;color:#8fa3cc;align-self:center}
.m-flow{border:1px solid rgba(130,160,255,0.16);border-radius:10px;padding:12px;background:rgba(99,102,241,0.04)}
.m-flow-q{font-size:12px;color:#fde68a;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:8px;padding:7px 11px;margin-bottom:10px}
.m-flow-steps{display:flex;flex-direction:column;gap:6px}
.m-step{
  display:flex;align-items:flex-start;gap:9px;border:1px solid rgba(130,160,255,0.10);
  border-radius:8px;padding:6px 9px;background:rgba(255,255,255,0.02);opacity:0.42;transition:all .25s;
}
.m-step.on{opacity:1;border-color:rgba(52,211,153,0.45);background:rgba(52,211,153,0.09);box-shadow:0 0 12px rgba(52,211,153,0.12)}
.m-step-num{
  flex:none;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,0.08);color:#b9c6ea;
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.m-step.on .m-step-num{background:#34d399;color:#04271c}
.m-step-tx{font-size:11.5px;line-height:1.5}
.m-step-tx b{display:block;color:#dbe4ff}
.m-step-tx span{color:#8fa3cc;font-size:10.5px}
.m-flow-controls{display:flex;align-items:center;gap:12px;margin-top:10px}
.m-flow-play{
  border:1px solid rgba(52,211,153,0.40);background:rgba(52,211,153,0.10);color:#6ee7b7;
  border-radius:8px;padding:6px 16px;font-size:12px;cursor:pointer;font-weight:700;
}
.m-flow-play:hover{background:rgba(52,211,153,0.22);color:#fff}
.m-flow-tip{font-size:10.5px;color:#8fa3cc}
.mc-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:nowrap}
.mc-back{
  flex:none;border:1px solid rgba(129,140,248,0.45);background:rgba(99,102,241,0.12);color:#c7d2fe;
  border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;transition:all .15s;
}
.mc-back:hover{background:rgba(99,102,241,0.25);color:#fff}
.mc-title{flex:1;font-size:11px;color:#8fa3cc;font-family:Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-code{
  font-family:Consolas,'Courier New',monospace;font-size:11.5px;line-height:1.55;
  background:rgba(2,6,16,0.72);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;overflow:auto;max-height:calc(84vh - 190px);
}
/* ── 数据流转播放器（自动播放） ── */
.dfp{
  border:1px solid rgba(129,140,248,0.25);border-radius:12px;padding:12px 14px;margin-bottom:8px;
  background:linear-gradient(180deg, rgba(99,102,241,0.10) 0%, rgba(56,189,248,0.05) 100%);
}
.dfp-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dfp-title{font-size:12px;font-weight:800;color:#c7d2fe}
.dfp-stepinfo{font-size:11px;color:#8fa3cc;margin-left:auto}
.dfp-play{
  border:1px solid rgba(52,211,153,0.40);background:rgba(52,211,153,0.10);color:#6ee7b7;
  border-radius:7px;padding:3px 10px;font-size:11px;cursor:pointer;font-weight:700;
}
.dfp-play:hover{background:rgba(52,211,153,0.22);color:#fff}
.dfp-input{
  font-size:11.5px;color:#fde68a;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.22);
  border-radius:8px;padding:6px 10px;margin-bottom:8px;
}
.dfp-progress{height:4px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin-bottom:10px}
.dfp-bar{height:100%;width:0;background:linear-gradient(90deg,#34d399,#38bdf8);transition:width .4s}
.dfp-body{display:flex;flex-direction:column;gap:6px}
.dfp-method{font-size:12px;color:#7dd3fc;font-family:Consolas,monospace;cursor:pointer;word-break:break-all}
.dfp-method:hover{text-decoration:underline}
.dfp-loop{font-size:10px;color:#fbbf24;margin-left:8px;font-family:sans-serif}
.dfp-desc{font-size:11.5px;color:#b9c6ea;line-height:1.5}
.dfp-data{background:rgba(2,6,16,0.65);border:1px solid rgba(130,160,255,0.15);border-radius:8px;padding:8px 10px}
.dfp-label{display:block;font-size:10px;color:#8fa3cc;margin-bottom:4px}
.dfp-data pre{margin:0;font-family:Consolas,monospace;font-size:11px;color:#dbe4ff;white-space:pre-wrap;word-break:break-all;line-height:1.55}
.dfp-dots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dfp-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.15);cursor:pointer;transition:all .2s}
.dfp-dot.on{background:#38bdf8;box-shadow:0 0 8px rgba(56,189,248,0.80)}
.dfp-output{display:none;margin-top:10px;background:rgba(2,6,16,0.65);border:1px solid rgba(130,160,255,0.15);border-radius:8px;padding:8px 10px;font-size:11px;color:#dbe4ff;line-height:1.6;word-break:break-all}
.live-dot{width:8px;height:8px;border-radius:50%;margin-left:2px;flex:none;transition:all .2s}
.live-dot.on{background:#34d399;box-shadow:0 0 8px rgba(52,211,153,0.80)}
.live-dot.off{background:#64748b}
.policy-badge{
  flex:none;font-size:10.5px;color:#a78bfa;border:1px dashed rgba(167,139,250,0.45);
  background:rgba(167,139,250,0.08);border-radius:12px;padding:3px 10px;white-space:nowrap;
}
.modlist{
  position:fixed;left:12px;top:calc(var(--head-h) + 52px);width:196px;z-index:34;
  background:rgba(8,13,30,0.92);border:1px solid var(--border);border-radius:12px;
  backdrop-filter:blur(16px);overflow:hidden;display:flex;flex-direction:column;
  max-height:calc(100vh - var(--head-h) - 64px);box-shadow:0 14px 44px rgba(0,0,0,0.5);
}
body:not(.modlist-open) .modlist{display:none}
.modlist-head{
  display:flex;align-items:center;justify-content:space-between;padding:9px 12px;
  border-bottom:1px solid var(--border);font-size:12px;color:#c7d2fe;font-weight:800;
}
.modlist-head button{border:none;background:rgba(255,255,255,0.06);color:var(--muted);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:11px}
.modlist-body{overflow-y:auto;padding:8px}
.mod-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;
  background:transparent;color:#b9c6ea;font-size:12px;padding:8px 10px;border-radius:8px;
  cursor:pointer;margin-bottom:3px;
}
.mod-item:hover{background:rgba(255,255,255,0.07);color:#fff}
.mod-item.on{background:rgba(99,102,241,0.20);border-color:rgba(129,140,248,0.50);color:#fff;font-weight:700}
.mod-item .cnt{margin-left:auto;font-size:10px;color:#8fa3cc}
body.modlist-open main{left:222px}
body.modlist-open .minimap{left:222px}
body.modlist-open .legend{left:222px}
.data-toast{
  position:fixed;top:calc(var(--head-h) + 48px);left:50%;transform:translateX(-50%);z-index:80;
  background:rgba(8,13,30,0.95);border:1px solid rgba(52,211,153,0.40);color:#d1fae5;border-radius:10px;
  padding:8px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;
  box-shadow:0 10px 34px rgba(0,0,0,0.5);
}
.data-toast.show{opacity:1}
.classify-menu{
  position:fixed;z-index:90;min-width:200px;max-height:70vh;overflow-y:auto;
  background:rgba(9,14,32,0.97);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 18px 50px rgba(0,0,0,0.55);padding:6px;display:none;backdrop-filter:blur(16px);
}
.classify-menu.open{display:block}
.classify-title{font-size:10.5px;color:#8fa3cc;padding:4px 10px 6px}
.classify-item{
  display:block;width:100%;text-align:left;border:none;background:transparent;color:#b9c6ea;
  font-size:12px;padding:7px 10px;border-radius:7px;cursor:pointer;
}
.classify-item:hover{background:rgba(99,102,241,0.18);color:#fff}
.classify-item.on{background:rgba(99,102,241,0.22);color:#fff;font-weight:700}
.node.dragging rect{stroke:#fbbf24;stroke-width:2;stroke-dasharray:4 3}
body.bg-only .topbar, body.bg-only #flowbar, body.bg-only #modlist, body.bg-only #diagram,
body.bg-only .legend, body.bg-only #minimap, body.bg-only .data-toast, body.bg-only .classify-menu,
body.bg-only .drawer, body.bg-only .modal-mask{display:none !important}
body.bg-only main{left:0 !important; top:0 !important; height:100vh !important}
#bg-exit{
  position:fixed;right:16px;bottom:16px;z-index:200;display:none;align-items:center;gap:8px;
  border:1px solid var(--border);background:rgba(8,13,30,0.85);border-radius:12px;
  padding:6px;backdrop-filter:blur(12px);
}
body.bg-only #bg-exit{display:flex}
#bg-exit button{
  display:flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
  color:var(--muted);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;white-space:nowrap;
}
#bg-exit button:hover{color:#fff;border-color:var(--border-strong);background:rgba(255,255,255,0.06)}
.occluder-wrap{position:absolute;inset:0;z-index:6;display:none;pointer-events:none}
body.calib .occluder-wrap{display:block}
.occluder-box{
  position:absolute;left:55%;top:25%;width:24%;height:38%;display:none;
  border:2px dashed #fbbf24;background:rgba(251,191,36,0.08);cursor:move;
}
body.calib .occluder-box{display:block;pointer-events:auto}
.occluder-tip{
  position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:10px;color:#fde68a;
  background:rgba(8,13,30,0.9);border:1px solid rgba(245,158,11,0.4);border-radius:6px;padding:2px 8px;white-space:nowrap;
}
.occluder-resize{
  position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;background:#fbbf24;
  border:2px solid #0b1228;border-radius:3px;cursor:nwse-resize;
}
.menu-btn.on{border-color:var(--border-strong);color:#fff;background:rgba(255,255,255,0.10)}
#mobile-menu-btn{display:none}
#mobile-menu-mask{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:110;display:none}
#mobile-menu-mask.open{display:block}
#mobile-menu{
  position:fixed;left:0;right:0;bottom:0;z-index:120;display:none;flex-direction:column;max-height:72vh;
  background:rgba(8,13,30,0.98);border-top:1px solid var(--border);border-radius:16px 16px 0 0;
  padding:12px 14px 18px;backdrop-filter:blur(18px);overflow-y:auto;
}
#mobile-menu.open{display:flex}
.mm2-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mm2-head b{color:#e7eeff;font-size:14px}
#mobile-menu-close{border:none;background:rgba(255,255,255,0.06);color:var(--muted);width:26px;height:26px;border-radius:8px;cursor:pointer}
.mm2-sec{font-size:11px;color:#8fa3cc;margin:10px 0 6px;font-weight:800;letter-spacing:1px}
.mm2-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mm2-item{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:#c7d2fe;border-radius:10px;padding:10px 12px;font-size:12.5px;cursor:pointer;text-align:left}
.mm2-item:hover{background:rgba(255,255,255,0.1);color:#fff}
.mm2-item.on{background:rgba(99,102,241,0.2);border-color:#818cf8;color:#fff}
body.bg-only #mobile-menu, body.bg-only #mobile-menu-mask{display:none !important}
/* 极简专注模式：关掉视频/星空，纯色背景 */
body.minimal #bg-video, body.minimal #aurora-video, body.minimal #bg-tint, body.minimal #stars{display:none !important}
body.minimal{background:linear-gradient(180deg,#0b1228 0%,#070d1e 100%)}
/* 移动端 / 窄屏适配 */
@media (max-width: 860px){
  .brand{display:none}
  .topbar{overflow-x:auto;padding:0 8px;gap:6px}
  .topbar,.flowbar,.modlist-body{scrollbar-width:none;-ms-overflow-style:none}
  .topbar::-webkit-scrollbar,.flowbar::-webkit-scrollbar,.modlist-body::-webkit-scrollbar{display:none}
  .stats,.policy-badge,#manual-btn,#bg-only-btn,#chain-menu,#view-menu,#flowbar{display:none}
  #mobile-menu-btn{display:flex}
  .search-box{max-width:170px}
  .modlist{left:0;right:0;bottom:0;top:auto;width:auto;max-height:38vh;border-radius:14px 14px 0 0}
  .modlist-body{display:grid;grid-template-columns:1fr 1fr;gap:4px;overflow-y:auto;padding:8px}
  .mod-item{width:100%;margin-bottom:0}
  body.modlist-open main{left:0}
  body.modlist-open .minimap{left:10px}
  .legend,#minimap{display:none}
  .drawer{width:min(440px,94vw)}
  .modal-code{width:94vw;height:82vh}
}
/* 无障碍：焦点高亮 */
:focus-visible{outline:2px solid #fbbf24;outline-offset:2px}
.node:focus rect{stroke:#fbbf24;stroke-width:2.5}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(120,155,255,0.25);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

<script>
const panelData = {"artery-a":{"type":"artery","typeLabel":"L0 大动脉","title":"动脉 A：知识文档 → RAG 检索","role":"把法律法规 PDF/Word 变成 AI 能检索的向量知识库","analogy":"\"厨师翻菜谱→做卡片→贴编号→贴进冰柜+记脑子里→客人点菜快速翻出\"","flow":[{"name":"knowledgebase/ 五子目录","desc":"国标/化工条例/园区规则/历史案例/H166——所有法规文档的原始存放处"},{"name":"全量入口 + 增量入口","desc":"启动时全量加载全部文档；运行时通过 POST /incremental-load 热加载新文档"},{"name":"ProcessSingleFileAsync","desc":"统一单文件处理管线入口，按 .pdf/.doc/.txt 后缀自动分派到对应解析器"},{"name":"PDF→PdfExtractor / DOC→DocExtractor / TXT→直读","desc":"三种文档格式各有专门解析器，提取原始文本内容"},{"name":"PdfOcrService :8083","desc":"当 PDF 文本层太薄（扫描件）时，调用本地 OCR 服务做视觉识别"},{"name":"NormalizeOcrText","desc":"OCR 结果源头归一化：把目录点线、表格线等噪音字符替换为白名单字符"},{"name":"TextCleaner","desc":"将 OCR 碎片化的单行文本重组为完整段落，恢复原始文档结构"},{"name":"SemanticChunker 语义切块","desc":"按法律条款(ChunkByClause)精准切分；条款缺失时用段落切分(ChunkByParagraph)兜底"},{"name":"GarbledTextDetector 乱码闸门","desc":"三条确定性规则筛查乱码块——宁可漏掉也不存入脏数据，直接拒绝入库"},{"name":"PG 写入 knowledge_documents + knowledge_chunks","desc":"文档元数据和切块文本写入 PostgreSQL，chunks 表包含向量字段"},{"name":"nomic-embed :8081 向量嵌入","desc":"对每个 chunk 生成 768 维向量，用于后续语义相似度检索"},{"name":"HybridKnowledgeBaseService","desc":"启动时在内存中构建 BM25 稀疏索引 + 向量密集索引，实现毫秒级混合检索"},{"name":"消费者：RAG工具 + KnowledgeBaseController","desc":"ChemicalComplianceTools 在回答问题时调用知识库检索；Controller 提供前端查询接口"}],"warns":["快速模式使存量乱码块常驻（约60条），闸门只拦增量不拦存量。全量OCR重灌进行中。"]},"artery-b":{"type":"artery","typeLabel":"L0 大动脉","title":"动脉 B：迁移脚本 → 知识图谱","role":"把 35 种化学品属性、安全距离、配伍禁忌插入 PostgreSQL 知识图谱五表","analogy":"\"装修时把配方刻在冰柜铜牌上，厨师上班时背下来——这是官方铜牌，不能乱编\"","flow":[{"name":"db/migrations/002_chemical_knowledge_graph.sql","desc":"部署期执行的一次性迁移脚本，化学品基础数据直接写死在 INSERT 语句中"},{"name":"psql 执行迁移","desc":"通过 PostgreSQL 命令行执行迁移脚本，仅部署时运行一次"},{"name":"PG 五张知识图谱表","desc":"substances(物质属性) / aliases(别名) / 禁忌边(配伍禁忌) / safety_distances(安全距离) / regulation_versions(法规版本)"},{"name":"LoadFromDatabase 全量加载","desc":"启动时 SELECT * 全部加载到内存，构建图数据结构"},{"name":"ChemicalKnowledgeGraph 内存图","desc":"在进程内存中构建化学品知识图谱，支持快速图遍历查询"},{"name":"ChemicalSubstanceDatabase 门面","desc":"81行纯转发类——封装所有图谱查询，是外部访问知识图谱的唯一入口"},{"name":"6个消费者","desc":"ChemicalComplianceTools(合规检查) / OutputSanitizer(输出清洗) / EvalEngine(评测) / ReflectionVerifier(反思验证) / EmergencyResponse(应急响应) / KnowledgeGraph(前端可视化)"}],"warns":["PG不可用→直接报错。图谱没有SQLite兜底——这是\"官方铜牌\"，不能从配方卡临时编。","命名陷阱：ChemicalSubstanceDatabase 名称为\"Database\"实为PG门面（纯转发）。"]},"artery-c":{"type":"artery","typeLabel":"L0 大动脉","title":"动脉 C：C# 种子 → SQLite 兜底","role":"把化学品基础数据写入单文件 SQLite，PG 挂了也能独立工作","analogy":"\"厨师口袋里的配方卡——随身带，不依赖冰柜，永远可用\"","flow":[{"name":"db/chemical_substances_v2.sql","desc":"仅定义表结构和视图，不含数据——数据结构与种子代码分离"},{"name":"C# 四个 Seed 方法","desc":"35种物质 / 21条安全距离 / 20组配伍禁忌 / 7部法规版本——代码中硬编码写入 SQLite"},{"name":"ChemicalDatabaseService.InitializeAsync","desc":"启动时检查 SQLite 是否已有数据→COUNT(*) == 0 则执行种子写入"},{"name":"整段 ExecuteNonQuery 执行","desc":"整个 SQL 语句作为整体执行，禁止 Split('';'') 分割——防止破坏 SQL 语法完整性"},{"name":"_initialized 后置标志位","desc":"仅写入成功后才置 true，失败则下次启动自动重试——保证数据完整性"},{"name":"SQLite 单文件 chemical_substances.db","desc":"不依赖 PostgreSQL，系统宕机时仍可通过此文件独立运行"},{"name":"消费者：ChemicalComplianceTools Level 1","desc":"三级降级查询的第一优先级——字段最全（含 clause 条款原文）"}],"warns":["反直觉：SQLite（备胎）排 Level 1，PG图谱（主库）排 Level 2——SQLite种子字段更全（含clause条款原文）。","COUNT(*)==0 才写种子。老库补数据需删库重建（Data/chemical_substances.db）。"]},"artery-d":{"type":"artery","typeLabel":"L0 大动脉","title":"动脉 D：配置 + 评测 → 运行时","role":"加载环境配置、质量规则和评测数据集，驱动缓存预热与自动化评测","analogy":"\"饭店营业规则贴墙上——早上开门看一遍。评测集是厨艺考试题库——考试时才翻。\"","flow":[{"name":".env + appsettings.json → AppConfig","desc":"敏感配置(密钥/连接串)放 .env，非敏感配置放 appsettings.json，统一绑定为 AppConfig 强类型对象"},{"name":"quality-rules.json → QualityRules","desc":"定义缓存门禁规则 R001/R002，Content 属性确保编译时拷贝到 bin 目录"},{"name":"消费者：MemoryService + ResponseCacheService","desc":"MemoryService 用 R001/R002 门禁缓存读写；ResponseCacheService 按命中类型分配不同 TTL"},{"name":"ComplianceEvalSet.json + BlindEvalSet.json","desc":"合规评测集（有标签）和盲评集（无标签），Content Include 编译时拷贝"},{"name":"消费者① EvalEngine 评测引擎","desc":"T13 无状态评测支线——按评测意图裁剪可用工具集 + TokenBudgetManager 预算检查"},{"name":"消费者② ResponseCacheService 预热","desc":"启动时遍历评测集问题，预先调用并缓存结果——WarmupFromEvalSet"},{"name":"消费者③ run_eval_pipeline.ps1","desc":"PowerShell 脚本驱动批量评测流水线，自动收集结果生成评测报告"}],"warns":["评测集格式升级时必须联动三个消费者！Bug #7：升级到v1.1 wrapper后忘了同步改ResponseCacheService预热逻辑。"]},"vein-1":{"type":"vein","typeLabel":"L1 静脉","title":"静脉 ①：结构化查询三级降级瀑布","role":"查一个化学品数据时，按 SQLite→PostgreSQL→硬编码字典 三级逐级降级，永远有兜底","analogy":"\"配方卡→冰柜铜牌→手写便签→老实说不知道\"","flow":[{"name":"查询请求","desc":"用户问\"苯的安全距离是多少\"——ChemicalComplianceTools 触发结构化查询"},{"name":"Level 1: SQLite 兜底库 _chemDb","desc":"优先查 SQLite——字段最全含 clause 原文，动脉 C 供血 [DATABASE_HIT]"},{"name":"Level 2: ChemicalSubstanceDatabase PG 门面","desc":"SQLite 无结果 → 查 PostgreSQL 知识图谱，动脉 B 供血 [DATABASE_HIT]"},{"name":"Level 3: 硬编码字典","desc":"PG 也无结果 → 使用 ChemicalComplianceTools 内部常量字典 [DICTIONARY_HIT]，质量降级但保证可用"},{"name":"最终兜底","desc":"三级全空 → 返回\"暂无数据\"话术，R001 质量规则禁止此结果进入缓存"}],"warns":["反直觉：SQLite（备胎）排Level1，PG图谱（主库）排Level2。原因：SQLite种子数据字段更全。"]},"vein-2":{"type":"vein","typeLabel":"L1 静脉","title":"静脉 ②：出口双通道闸门","analogy":"\"先检查偷工减料→摘确切信息→白名单核对→拼成品→主管尝一口确认\"","gates":[{"title":"FC=Required 违约闸门","desc":"toolCalls==0 → 丢弃LLM输出 → FactAssembler.BuildNoResult() 生成\"无法确定\"。耦合声明：依赖FC=Required契约，未来改Auto/None必须同步移除。"},{"title":"FactExtractor 事实提取","desc":"从工具返回的数据库结果中摘出关键字段，不信任LLM的自由文本发挥。"},{"title":"OutputSanitizer 动态白名单清洗","desc":"当次查询返回的合法值才放行，其余标记为\"待核实\"。动态白名单确保不越权输出。"},{"title":"FactAssembler 确定性事实渲染","desc":"不用LLM二次加工——防止大模型在事实基础上添油加醋、产生幻觉。纯确定性逻辑渲染。"},{"title":"ResponseMerger 合并 + 分支验证","desc":"合并多工具结果→ API路径: ConclusionVerifier法规验证（三级优先级：标签→正则→关键词）| CLI路径: OutputValidator库白名单（动脉B∪动脉C∪硬编码字典三源并集）"}],"warns":["Bug-032 v2修复背景：旧逻辑FC违约后仍使用LLM裸输出，导致回答基于\"大模型瞎编\"而非真实数据。现改为完全丢弃+兜底方案。"]},"vein-3":{"type":"vein","typeLabel":"L1 静脉","title":"静脉 ③：记忆缓存旁路","role":"已查过的结果缓存起来下次直接用——但低质量兜底话术绝不入缓存，防止\"劣币驱逐良币\"","analogy":"\"做过的菜记脑子里，下次直接端——但失败的菜不记\"","flow":[{"name":"IsFallbackContent 兜底检测","desc":"R001 正则匹配 + ToolQualityContext——识别\"暂无数据\"等低质量兜底话术"},{"name":"兜底话术 → 拒绝写入","desc"   var SEGMENTS = [

    if (moduleGrid) {

      var colsN = mw < 700 ? 1 : (shown.length > 20 ? 3 : shown.length > 8 ? 2 : 1);

  var view = { k: 1, x: 0, y: 0 };
  function applyView(){
    world.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');
  }
  function fit(){
    var b;
    try { b = world.getBBox(); } catch (e) { return; }
    if (!b.width || !b.height) return;
    var w = svg.clientWidth, h = svg.clientHeight;
    var k = Math.min(w / b.width, h / b.height) * 0.92;
    view.k = Math.max(0.03, Math.min(2.5, k));
    view.x = (w - b.width * view.k) / 2 - b.x * view.k;
    view.y = (h - b.height * view.k) / 2 - b.y * view.k;
    applyView();
  }
  function focusAt(x, y){
    var w = svg.clientWidth, h = svg.clientHeight;
    view.x = w / 2 - x * view.k;
    view.y = h / 2 - y * view.k;
    applyView();
  }
  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    var rect = svg.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var factor = e.deltaY < 0 ? 1.12 : 0.89;
    var k2 = Math.max(0.03, Math.min(3, view.k * factor));
    view.x = mx - (mx - view.x) * (k2 / view.k);
    view.y = my - (my - view.y) * (k2 / view.k);
    view.k = k2;
    applyView();
  }, { passive: false });
  var drag = null;
  svg.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.node') || e.target.closest('.col-head') || e.target.closest('.ext-box')) return;
    drag = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
    svg.classList.add('dragging');
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  });
  svg.addEventListener('pointermove', function (e) {
    if (!drag) return;
    view.x = drag.vx + (e.clientX - drag.sx);
    view.y = drag.vy + (e.clientY - drag.sy);
    applyView();
  });
  svg.addEventListener('pointerup', function () { drag = null; svg.classList.remove('dragging'); });
  svg.addEventListener('pointercancel', function () { drag = null; svg.classList.remove('dragging'); });

  function zoomStep(f){
    var k2 = Math.max(0.03, Math.min(3, view.k * f));
    var w = svg.clientWidth, h = svg.clientHeight;
    view.x = w / 2 - (w / 2 - view.x) * (k2 / view.k);
    view.y = h / 2 - (h / 2 - view.y) * (k2 / view.k);
    view.k = k2;
    applyView();
  }

    function normalizeLog(t) {
    return t.replace(/\[.*?\]/g,' ').replace(/[^\u4e00-\u9fa5a-zA-Z0-9_]/g,' ').replace(/\s+/g,' ').trim();
  }
  document.getElementById('trace-parse').onclick = function () {
    var raw = textarea.value;
    var res = document.getElementById('trace-res');
    res.innerHTML = '';
    if (!raw.trim()) { res.innerHTML = '<div class="empty-tip">\u8bf7\u7c98\u8d34\u65e5\u5fd7\u5185\u5bb9</div>'; return; }

    var normalized = normalizeLog(raw);
    var query = normalized.split(/\s+/).filter(function(w){ return w.length > 2; }).slice(0, 3).join(' ');
    if (!query) query = raw.replace(/[^\u4e00-\u9fa5a-zA-Z0-9_]/g,' ').split(/\s+/).filter(function(w){ return w.length > 2; }).slice(0, 3).join(' ');

    // ── 自学习指纹库（localStorage 持久化）──
    var learned = {};
    try { learned = JSON.parse(localStorage.getItem('bloodmap_learned') || '{}'); } catch(e) {}
    function learn(q, file) {
      var key = q.toLowerCase().replace(/\s+/g,' ').trim();
      if (!learned[key]) learned[key] = [];
      if (learned[key].indexOf(file) === -1) learned[key].push(file);
      try { localStorage.setItem('bloodmap_learned', JSON.stringify(learned)); } catch(e) {}
    }
    function checkLearned(q) {
      var key = q.toLowerCase().replace(/\s+/g,' ').trim();
      return learned[key] || [];
    }

    // ── 策略 A：从堆栈中提取文件路径 ──
    var re = /([A-Za-z0-9_\-."]+\/(?:[A-Za-z0-9_\-."]+\/)*[A-Za-z0-9_\-.]+)\.(cs|ts|vue|json|sql)/g;
    var m, seen = {}, hits = [];
    while ((m = re.exec(raw)) !== null) {
      var p = norm(m[0]);
      var n = byPath[p];
      if (!n) { var name = m[0].split('/').pop(); nodes.forEach(function (x) { if (x.name === name && !seen[x.id]) { seen[x.id] = 1; hits.push(x); } }); }
      else if (!seen[n.id]) { seen[n.id] = 1; hits.push(n); }
    }

    // ── 策略 B：自学习指纹缓存（localStorage 热命中）──
    if (!hits.length && query) {
      var cached = checkLearned(query);
      cached.forEach(function(file) {
        var node = byPath[norm(file)];
        if (!node) { var fname = file.split('/').pop(); nodes.forEach(function(x){ if (x.name === fname && !seen[x.id]) { seen[x.id]=1; node=x; } }); }
        if (node && !seen[node.id]) { seen[node.id]=1; hits.push(node); node._fpScore=90; node._fpStrategy='learned'; }
      });
    }

    function showResults() {
      if (!hits.length) {
        res.innerHTML = '<div class="empty-tip"><b>\u672a\u5339\u914d\u5230\u4efb\u4f55\u4ee3\u7801\u4f4d\u7f6e</b><br><br>\u5c1d\u8bd5\u5728\u7ec8\u7aef\u8fd0\u884c grep\uff1a<br><code style="color:#7dd3fc;font-size:11px">Get-ChildItem -Path "Agent1" -Recurse -Filter "*.cs" | Select-String -Pattern "\u5173\u952e\u8bcd"</code></div>';
        return;
      }
      var high = [], mid = [], low = [];
      hits.forEach(function (n) {
        var sc = n._fpScore || 100;
        if (sc >= 80) high.push(n); else if (sc >= 50) mid.push(n); else low.push(n);
      });
      function renderGroup(title, group, color) {
        if (!group.length) return;
        var hdr = document.createElement('div');
        hdr.style.cssText = 'font-size:11px;color:'+color+';margin:8px 0 4px;font-weight:700;letter-spacing:0.5px';
        hdr.textContent = title + ' (' + group.length + ')';
        res.appendChild(hdr);
        group.forEach(function (n) {
          var d = document.createElement('div');
          d.className = 'hit';
          var badgeHtml = '';
          if (n._fpStrategy) {
            var badgeColor = n._fpScore >= 80 ? '#34d399' : n._fpScore >= 50 ? '#fbbf24' : '#94a3b8';
            badgeHtml = '<span style="font-size:9px;background:'+badgeColor+'20;color:'+badgeColor+';border:1px solid '+badgeColor+'40;border-radius:4px;padding:1px 5px;margin-left:auto;white-space:nowrap">'+n._fpStrategy+' '+n._fpScore+'%</span>';
          }
          d.innerHTML = '<span>' + ico(n.icon, 13) + '</span><b>' + esc(n.name) + '</b><code>' + esc(n.path) + '</code>' + (n._fpLine ? '<span style="font-size:10px;color:#94a3b8;margin-left:4px">:' + n._fpLine + '</span>' : '') + badgeHtml;
          if (n._fpContent) { var cnt = document.createElement('div'); cnt.style.cssText = 'font-size:10px;color:#64748b;margin:2px 0 0 20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px'; cnt.textContent = n._fpContent; d.appendChild(cnt); }
          d.onclick = function () { mask.classList.remove('open'); focusNode(n.id); };
          res.appendChild(d);
        });
      }
      renderGroup('\u2605\u2605\u2605 \u9ad8\u7f6e\u4fe1\u5ea6', high, '#34d399');
      renderGroup('\u2605\u2605\u2606 \u4e2d\u7f6e\u4fe1\u5ea6', mid, '#fbbf24');
      renderGroup('\u2605\u2606\u2606 \u4f4e\u7f6e\u4fe1\u5ea6', low, '#94a3b8');
    }

    // ── 策略 C：动态文件系统 grep（调用 API，命中后自动学习）──
    if (!hits.length && query) {
      res.innerHTML = '<div class="empty-tip">\u6b63\u5728\u641c\u7d22\u4ee3\u7801\u5e93...</div>';
      fetch('/api/grep?q=' + encodeURIComponent(query))
        .then(function(r){ return r.json(); })
        .then(function(grepResults) {
          if (!grepResults.length || grepResults.error) { showResults(); return; }
          grepResults.forEach(function(gr) {
            learn(query, gr.file);
            var node = byPath[norm(gr.file)];
            if (!node) {
              var fname = gr.file.split('/').pop();
              nodes.forEach(function(x){ if (x.name === fname && !seen[x.id]) { seen[x.id]=1; node=x; } });
            }
            if (node && !seen[node.id]) { seen[node.id]=1; hits.push(node); node._fpScore=65; node._fpStrategy='grep'; node._fpLine=gr.line; node._fpContent=gr.content; }
          });
          showResults();
        })
        .catch(function(){ showResults(); });

    }

  };

function resizeStars(){
    var host = starCanvas.parentElement;
    starCanvas.width = host.clientWidth;
    starCanvas.height = host.clientHeight;
    var w = starCanvas.width, h = starCanvas.height;
    if (!w || !h) return;
    starField = [];
    var count = Math.max(320, Math.min(900, Math.floor(w * h / 1800)));
    for (var i = 0; i < count; i++) {
      var r = Math.random();
      var size = r < 0.72 ? 0.28 + Math.random() * 0.45 : r < 0.95 ? 0.6 + Math.random() * 0.55 : 0.9 + Math.random() * 0.9;
      var temp = Math.random();
      var color;
      if (temp < 0.68) color = [255, 252, 245];
      else if (temp < 0.92) color = [205, 220, 255];
      else color = [255, 235, 200];
      starField.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: size,
        baseA: 0.18 + Math.random() * 0.55,
        p: Math.random() * Math.PI * 2,
        sp: 0.003 + Math.random() * 0.012,
        depth: 0.2 + Math.random() * 0.8,
        color: color,
        bright: Math.random() < 0.018
      });
    }
  }

function drawAurora(t){
    var w = starCanvas.width, h = starCanvas.height;
    var layers = [
      { y0: h * 0.13, amp: h * 0.05, color: 'rgba(80,255,190,', alpha: 0.10, speed: 0.0005 },
      { y0: h * 0.30, amp: h * 0.06, color: 'rgba(120,170,255,', alpha: 0.09, speed: 0.0004 },
      { y0: h * 0.07, amp: h * 0.045, color: 'rgba(210,130,255,', alpha: 0.07, speed: 0.0006 }
    ];
    function ribbon(ly, width, alphaMul){
      var grad = sctx.createLinearGradient(0, 0, w, 0);
      grad.addColorStop(0, ly.color + '0)');
      grad.addColorStop(0.5, ly.color + ly.alpha + ')');
      grad.addColorStop(1, ly.color + '0)');
      sctx.strokeStyle = grad;
      sctx.lineWidth = width;
      sctx.globalAlpha = alphaMul;
      sctx.beginPath();
      sctx.moveTo(0, ly.y0 + Math.sin(t * 0.0003) * ly.amp);
      for (var x = 0; x <= w; x += 20) {
        var y = ly.y0
          + Math.sin(x * 0.004 + t * ly.speed * 100) * ly.amp * 1.6
          + Math.sin(x * 0.001 + t * 0.0002) * ly.amp;
        sctx.lineTo(x, y);
      }
      sctx.stroke();
    }
    for (var i = 0; i < layers.length; i++) {
      ribbon(layers[i], 42, 0.5);
      ribbon(layers[i], 7, 0.32);
    }
    sctx.globalAlpha = 1;
  }

  
  
  function drawStars(t){
    var w = starCanvas.width, h = starCanvas.height;
    if (!w || !h) return;
    sctx.clearRect(0, 0, w, h);
    // drawAurora(t);
    if (!layerCanvas || layerCanvas.width !== w || layerCanvas.height !== h) {
      layerCanvas.width = w;
      layerCanvas.height = h;
    }
    lctx.clearRect(0, 0, w, h);
    var px = (starPointer.x - 0.5) * 14;
    var py = (starPointer.y - 0.5) * 10;
    for (var i = 0; i < starField.length; i++) {
      var s = starField[i];
      var sx = s.x + px * s.depth;
      var sy = s.y + py * s.depth;
      var tw = 0.72 + 0.08 * Math.sin(s.p + t * 0.0012 * s.sp);
      var a = Math.min(1, s.baseA * tw);
      lctx.beginPath();
      lctx.fillStyle = 'rgba(' + s.color[0] + ',' + s.color[1] + ',' + s.color[2] + ',' + a + ')';
      lctx.arc(sx, sy, s.r, 0, Math.PI * 2);
      lctx.fill();
      if (s.bright) {
        var flare = s.r * 6;
        lctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.10) + ')';
        lctx.lineWidth = 0.6;
        lctx.beginPath();
        lctx.moveTo(sx - flare, sy);
        lctx.lineTo(sx + flare, sy);
        lctx.moveTo(sx, sy - flare);
        lctx.lineTo(sx, sy + flare);
        lctx.stroke();
        lctx.beginPath();
        lctx.fillStyle = 'rgba(255,255,255,' + (a * 0.07) + ')';
        lctx.arc(sx, sy, s.r * 2.8, 0, Math.PI * 2);
        lctx.fill();
      }
    }
    // 流星雨：同时最多 6 颗，持续划过（明亮 + 头部光晕）
    if (meteors.length < 6 && Math.random() < 0.035) {
      meteors.push({
        x: Math.random() * w,
        y: Math.random() * h * 0.35,
        vx: 6 + Math.random() * 9,
        vy: 1.8 + Math.random() * 3.5,
        life: 1,
        len: 14 + Math.random() * 12
      });
    }
    for (var mi = meteors.length - 1; mi >= 0; mi--) {
      var mt = meteors[mi];
      var a = Math.min(1, mt.life * 1.1);
      var grad = lctx.createLinearGradient(mt.x, mt.y, mt.x - mt.vx * mt.len, mt.y - mt.vy * mt.len);
      grad.addColorStop(0, 'rgba(210,235,255,' + a + ')');
      grad.addColorStop(1, 'rgba(210,235,255,0)');
      lctx.strokeStyle = grad;
      lctx.lineWidth = 1.5;
      lctx.beginPath();
      lctx.moveTo(mt.x, mt.y);
      lctx.lineTo(mt.x - mt.vx * mt.len, mt.y - mt.vy * mt.len);
      lctx.stroke();
      lctx.beginPath();
      lctx.fillStyle = 'rgba(255,255,255,' + (a * 0.55) + ')';
      lctx.arc(mt.x, mt.y, 2.2, 0, Math.PI * 2);
      lctx.fill();
      lctx.beginPath();
      lctx.fillStyle = 'rgba(160,200,255,' + (a * 0.18) + ')';
      lctx.arc(mt.x, mt.y, 5, 0, Math.PI * 2);
      lctx.fill();
      mt.x += mt.vx;
      mt.y += mt.vy;
      mt.life -= 0.006;
      if (mt.life <= 0) meteors.splice(mi, 1);
    }
    sctx.drawImage(layerCanvas, 0, 0);
    // 柔和遮挡：人物区域模糊擦除 → 星星/流星从身后划过
    if (occluders.length) {
      sctx.save();
      sctx.globalCompositeOperation = 'destination-out';
      sctx.filter = 'blur(14px)';
      sctx.fillStyle = '#000';
      occluders.forEach(function (o) {
        sctx.beginPath();
        sctx.rect(o.x * w, o.y * h, o.w * w, o.h * h);
        sctx.fill();
      });
      sctx.restore();
    }
  }

      var nw = Math.max(40, occDrag.w + dx);
      var nh = Math.max(30, occDrag.h + dy);
      occluderBox.style.width = Math.min(mw - occDrag.lx, nw) + 'px';
      occluderBox.style.height = Math.min(mh - occDrag.ty, nh) + 'px';
    }
  });
  window.addEventListener('mouseup', function () { occDrag = null; });
  document.getElementById('bg-only-btn').onclick = toggleBgOnly;
  document.getElementById('bg-exit-btn').onclick = toggleBgOnly;
  document.getElementById('occluder-btn').onclick = toggleCalib;
  document.addEventListener('keydown', function (e) {
    if (e.key === 'b' || e.key === 'B') {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      toggleBgOnly();
    }
    if (e.key === 'o' || e.key === 'O') {
      var t2 = e.target;
      if (t2 && (t2.tagName === 'INPUT' || t2.tagName === 'TEXTAREA')) return;
      if (document.body.classList.contains('bg-only')) toggleCalib();
    }
  });

  // ── 移动端功能菜单（底部面板，替代顶部横滑） ──
  function closeMobileMenu(){
    var m = document.getElementById('mobile-menu');
    var mask = document.getElementById('mobile-menu-mask');
    if (m) m.classList.remove('open');
    if (mask) mask.classList.remove('open');
  }
  function renderMobileMenu(){
    var body = document.getElementById('mobile-menu-body');
    if (!body) return;
    var html = '<div class="mm2-sec">业务链路</div><div class="mm2-grid">';
    chainOrder.forEach(function (id) {
      var c = callChains[id];
      if (c) html += '<button class="mm2-item" data-chain="' + id + '">' + ico(c.icon, 13) + ' ' + esc(c.title) + '</button>';
    });
    html += '</div><div class="mm2-sec">视图</div><div class="mm2-grid">';
    html += '<button class="mm2-item" data-act="fit">' + ico('maximize', 13) + ' 适应窗口</button>';
    html += '<button class="mm2-item" data-act="capsule">' + ico('package', 13) + ' 胶囊模式</button>';
    html += '<button class="mm2-item" data-act="minimal">' + ico('eye', 13) + ' 极简模式</button>';
    html += '<button class="mm2-item" data-act="theme">' + ico('sun', 13) + ' 浅色主题</button>';
    html += '<button class="mm2-item" data-act="reset">' + ico('rotate', 13) + ' 重置视图</button>';
    html += '</div><div class="mm2-sec">工具</div><div class="mm2-grid">';
    html += '<button class="mm2-item" data-act="manual">' + ico('book', 13) + ' 模块手册</button>';
    html += '<button class="mm2-item" data-act="bg">' + ico('eye', 13) + ' 只看背景</button>';
    html += '<button class="mm2-item" data-act="trace">' + ico('search', 13) + ' 日志追踪</button>';
    html += '</div>';
    body.innerHTML = html;
    body.querySelectorAll('[data-chain]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-chain');
        closeMobileMenu();
        closeOverlays(false);
        toggleChain(id);
      };
    });
    body.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var act = b.getAttribute('data-act');
        closeMobileMenu();
        if (act === 'fit') fit();
        else if (act === 'capsule') { capsuleMode = !capsuleMode; capsuleOpenCol = null; applyViewMode(); }
        else if (act === 'minimal') { document.body.classList.toggle('minimal'); }
        else if (act === 'theme') {
          var on = document.body.classList.toggle('theme-light');
          b.innerHTML = ico(on ? 'moon' : 'sun', 13) + ' ' + (on ? '深色主题' : '浅色主题');
        }
        else if (act === 'reset') { view = { k: 1, x: 0, y: 0 }; applyView(); }
        else if (act === 'manual') { closeOverlays(false); manualIdx = 0; renderManual(); manualMask.classList.add('open'); }
        else if (act === 'bg') { toggleBgOnly(); }
        else if (act === 'trace') { closeOverlays(false); document.getElementById('trace-mask').classList.add('open'); }
      };
    });
  }
  function openMobileMenu(){
    renderMobileMenu();
    document.getElementById('mobile-menu').classList.add('open');
    document.getElementById('mobile-menu-mask').classList.add('open');
  }
  document.getElementById('mobile-menu-btn').onclick = openMobileMenu;
  document.getElementById('mobile-menu-close').onclick = closeMobileMenu;
  document.getElementById('mobile-menu-mask').addEventListener('click', closeMobileMenu);

  // ───────────────────────── 收尾 ─────────────────────────
  document.getElementById('stats').innerHTML =
    '模块 <b>' + COLS.length + '</b> · 类/文件 <b>' + nodes.length + '</b> · 链路 <b>' + Object.keys(callChains).length + '</b> · 外部系统 <b>' + EXT.length + '</b>';
  applyView();
  renderFlowbar();
  openModuleView('core');
  fetchDynamicData();
})();
</script>
</body>
</html>
