name: CI

on:
  push:
    branches: [main, develop, feature/partner-dev]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════
  # Job 1: 编译 + 纯单元测试（Mock, 零外部依赖）
  # ═══════════════════════════════════════
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit Tests (Mock, no DB/LLM needed)
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Architecture Convergence Test
        run: dotnet run --project ArchitectureTest --configuration Release
        continue-on-error: true

      - name: Benchmark (non-blocking)
        run: dotnet run --project Benchmark --configuration Release -- 5 20 http://localhost:5000
        continue-on-error: true

  # ═══════════════════════════════════════
  # Job 2: 数据库集成测试（CI 自动提供临时 PostgreSQL）
  # ═══════════════════════════════════════
  integration-test:
    needs: build-and-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: chemical_park_ai_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration_test_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Init Database
        run: |
          PGPASSWORD=integration_test_pwd psql -h localhost -U postgres -d chemical_park_ai_agent -f init_database.sql

      - name: Run Integration Tests
        run: dotnet test --configuration Release --filter "Category=Integration"
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: chemical_park_ai_agent
          DB_USERNAME: postgres
          DB_PASSWORD: integration_test_pwd

  # ═══════════════════════════════════════
  # Job 3: Docker 镜像构建（仅 main 分支）
  # ═══════════════════════════════════════
  docker:
    needs: [build-and-test, integration-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Normalize repo name (GHCR requires lowercase)
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}

  # ═══════════════════════════════════════
  # Job 4: CI 结果邮件通知（失败时发送到 QQ 邮箱）
  # ═══════════════════════════════════════
  notify:
    needs: [build-and-test, integration-test, docker]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.QQ_EMAIL }}" ] || [ -z "${{ secrets.QQ_SMTP_CODE }}" ]; then
            echo "::warning::QQ_EMAIL or QQ_SMTP_CODE secret not configured, skipping email notification"
            echo "SKIP_NOTIFY=true" >> $GITHUB_ENV
          fi

      - name: Send failure notification
        if: env.SKIP_NOTIFY != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_SMTP_CODE }}
          subject: "[Agent1 CI Failed] ${{ github.repository }} — ${{ github.ref_name }}"
          body: |
            CI 工作流执行失败！

            仓库: ${{ github.repository }}
            分支: ${{ github.ref_name }}
            提交: ${{ github.sha }}
            提交信息: ${{ github.event.head_commit.message }}
            触发者: ${{ github.actor }}

            查看详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.QQ_EMAIL }}
          from: ${{ secrets.QQ_EMAIL }}

  # ═══════════════════════════════════════
  # Job 5: Staging 环境自动部署
  # 基于 GHCR 预构建镜像，SSH 到 staging 服务器执行 docker-compose pull + up
  # 触发条件: main / feature/partner-dev 分支 push，且 build-test + docker 均通过
  # 所需 Secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY
  # 所需 Vars: STAGING_URL, STAGING_PROJECT_PATH
  # ═══════════════════════════════════════
  staging-deploy:
    needs: [build-and-test, integration-test, docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/partner-dev'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.STAGING_HOST }}" ] || [ -z "${{ secrets.STAGING_SSH_KEY }}" ]; then
            echo "::warning::STAGING_HOST or STAGING_SSH_KEY not configured, skipping staging deploy"
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          fi

      - name: Deploy to staging via SSH
        if: env.SKIP_DEPLOY != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ vars.STAGING_PROJECT_PATH }}
            echo "[DEPLOY] Pulling latest images..."
            docker-compose -f docker-compose.yml -f docker-compose.staging.yml pull api
            echo "[DEPLOY] Restarting api service..."
            docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans api
            echo "[DEPLOY] Waiting for health check..."
            sleep 10
            docker-compose ps

      - name: Smoke test (health check)
        if: env.SKIP_DEPLOY != 'true'
        run: |
          echo "[SMOKE] Waiting for service to stabilize..."
          for i in $(seq 1 12); do
            if curl -sf ${{ vars.STAGING_URL }}/health/live 2>/dev/null; then
              echo ""
              echo "[SMOKE] ✅ /health/live OK"
              break
            fi
            echo "[SMOKE] Attempt $i/12 — not ready yet, retrying in 5s..."
            sleep 5
          done
          curl -sf ${{ vars.STAGING_URL }}/health || echo "::warning::/health endpoint check failed (may need LLM/DB)"
          echo "[SMOKE] ✅ Deployment smoke test complete"
