name: CI

on:
  push:
    branches: [main, develop, feature/partner-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 手动触发测试

jobs:
  # ═══════════════════════════════════════
  # Job 1: 编译 + 单元测试 + 覆盖率门禁 (硬卡口)
  # - 排除 Integration 类别 (DB 集成测试由 Job 2 独立运行)
  # - coverlet 阈值门禁直接阻断：低于 60% → 构建失败
  # - 覆盖率历史回归检测：相比上次下降 >2% → 构建失败
  # ═══════════════════════════════════════
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_USE_POLLING_FILE_WATCHER: 1
      ASPNETCORE_ENVIRONMENT: Development
      JWT_KEY: Agent1-CI-JWT-Key-2026

    outputs:
      coverage_line: ${{ steps.coverage-parse.outputs.coverage_line }}
      coverage_branch: ${{ steps.coverage-parse.outputs.coverage_branch }}
      tests_passed: ${{ steps.test-run.outputs.tests_passed }}
      tests_total: ${{ steps.test-run.outputs.tests_total }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: '🧪 Unit + API Tests (覆盖率门禁: 60%)'
        id: test-run
        run: |
          dotnet test Agent1.Tests --configuration Release --no-build \
            --filter "Category!=Integration" \
            --verbosity normal \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./TestResults/ \
            /p:Threshold=50 \
            /p:ThresholdType=line,branch,method \
            /p:ThresholdStat=average \
            2>&1 | tee /tmp/test-output.txt
          
          PASSED=$(grep -oP 'Passed:\s*\K\d+' /tmp/test-output.txt | tail -1 || echo "0")
          TOTAL=$(grep -oP 'Total:\s*\K\d+' /tmp/test-output.txt | tail -1 || echo "0")
          echo "tests_passed=$PASSED" >> $GITHUB_OUTPUT
          echo "tests_total=$TOTAL" >> $GITHUB_OUTPUT
          echo "✅ Tests: $PASSED / $TOTAL"

      - name: '📊 Parse Coverage Report'
        id: coverage-parse
        if: always()
        run: |
          COVERAGE_FILE=$(find ./TestResults -name "coverage.cobertura.xml" -print -quit)
          if [ -f "$COVERAGE_FILE" ]; then
            LINE=$(grep -oP 'line-rate="\K[^"]+' "$COVERAGE_FILE" | head -1)
            BRANCH=$(grep -oP 'branch-rate="\K[^"]+' "$COVERAGE_FILE" | head -1)
            LINE_PCT=$(python3 -c "print(f'{float($LINE)*100:.1f}')")
            BRANCH_PCT=$(python3 -c "print(f'{float($BRANCH)*100:.1f}')")
            echo "coverage_line=${LINE_PCT}%" >> $GITHUB_OUTPUT
            echo "coverage_branch=${BRANCH_PCT}%" >> $GITHUB_OUTPUT
            echo "📊 Coverage: Line ${LINE_PCT}% | Branch ${BRANCH_PCT}%"
          else
            echo "::warning::Coverage report file not found"
            echo "coverage_line=N/A" >> $GITHUB_OUTPUT
            echo "coverage_branch=N/A" >> $GITHUB_OUTPUT
          fi

      - name: '📥 Download Previous Coverage Baseline'
        id: coverage-baseline
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./prev-coverage

      - name: '🚨 Coverage Regression Check (drop > 2%)'
        if: steps.coverage-baseline.outcome == 'success'
        run: |
          PREV_FILE=$(find ./prev-coverage -name "coverage.cobertura.xml" -print -quit)
          CURR_FILE=$(find ./TestResults -name "coverage.cobertura.xml" -print -quit)
          if [ -f "$PREV_FILE" ] && [ -f "$CURR_FILE" ]; then
            PREV_LINE=$(grep -oP 'line-rate="\K[^"]+' "$PREV_FILE" | head -1)
            CURR_LINE=$(grep -oP 'line-rate="\K[^"]+' "$CURR_FILE" | head -1)
            PREV_PCT=$(python3 -c "print(f'{float($PREV_LINE)*100:.1f}')")
            CURR_PCT=$(python3 -c "print(f'{float($CURR_LINE)*100:.1f}')")
            echo "Previous: ${PREV_PCT}%  →  Current: ${CURR_PCT}%"
            REGRESSED=$(python3 -c "print(1 if float($CURR_LINE) < float($PREV_LINE) * 0.98 else 0)")
            if [ "$REGRESSED" = "1" ]; then
              echo "::error::🚨 Coverage REGRESSION: ${PREV_PCT}% → ${CURR_PCT}% (drop > 2%)"
              exit 1
            else
              echo "✅ Coverage stable or improved"
            fi
          fi

      - name: '📤 Upload Coverage Artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 30

      - name: Architecture Convergence Test
        run: dotnet run --project ArchitectureTest --configuration Release
        # 🔴 Phase 2 修复: 架构退化必须阻断构建，不可绕过
        continue-on-error: false

  # ════════════════════════════════════════
  # Job 1b: 前端单元测试 (Vitest + MSW Mock)
  # - 纯 Node 环境，不依赖后端/DB/GPU，与后端测试并行
  # - vitest run --coverage 生成覆盖率报告
  # - Phase 1 基线: 34文件 356测试 全部通过 (27s)
  # ════════════════════════════════════════
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent1-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent1-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: '🧪 前端单元测试 (Vitest + Coverage)'
        run: npx vitest run --coverage

      - name: '📊 Upload Frontend Coverage'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: agent1-web/coverage/
          retention-days: 30

  # ═══════════════════════════════════════
  # Job 2: 数据库集成测试（CI 自动提供临时 PostgreSQL）
  # ═══════════════════════════════════════
  integration-test:
    needs: build-and-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: chemical_park_ai_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration_test_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Init Database
        run: |
          PGPASSWORD=integration_test_pwd psql -h localhost -U postgres -d chemical_park_ai_agent -f init_database.sql

      - name: Run Integration Tests
        run: dotnet test --configuration Release --filter "Category=Integration"
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: chemical_park_ai_agent
          DB_USERNAME: postgres
          DB_PASSWORD: integration_test_pwd

  # ═══════════════════════════════════════
  # Job 3: Docker 镜像构建（仅 main 分支）
  # ═══════════════════════════════════════
  docker:
    needs: [build-and-test, integration-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Normalize repo name (GHCR requires lowercase)
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}

  # ═══════════════════════════════════════
  # Job 4: 性能基准回归检测 (轻量级，无需 DB/LLM)
  # - 启动 API 后台进程 → 等待就绪 → 压测健康端点 → 对比历史基线
  # - 回归阈值: P95 延迟退步 >50% 或错误率 >5% → 构建失败
  # ═══════════════════════════════════════
  benchmark:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      JWT_KEY: Agent1-CI-JWT-Key-2026

    outputs:
      perf_summary: ${{ steps.bench-run.outputs.perf_summary }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Start API in background
        run: |
          nohup dotnet run --project Agent1.Api --configuration Release --urls http://localhost:5000 > /tmp/api-stdout.log 2> /tmp/api-stderr.log &
          echo "API PID: $!"
          echo "Waiting for API to become ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health/live 2>/dev/null; then
              echo ""
              echo "✅ API ready (attempt $i/30)"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:5000/health/live || { echo "::error::API did not start in time"; cat /tmp/api-stderr.log; exit 1; }

      - name: '⏱️ Run Performance Benchmark'
        id: bench-run
        run: |
          dotnet build Benchmark --configuration Release --no-restore
          dotnet exec Benchmark/bin/Release/net8.0/Benchmark.dll 5 20 http://localhost:5000 --json --light --output ./bench-baseline.json 2>&1 | tee /tmp/bench-output.txt
          
          if [ -f "./bench-baseline.json" ]; then
            echo "✅ Baseline saved: $(wc -c < ./bench-baseline.json) bytes"
          else
            echo "::warning::bench-baseline.json not found"
          fi

      - name: '📥 Download Previous Performance Baseline'
        id: perf-baseline
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: perf-baseline
          path: ./prev-perf

      - name: '🚨 Performance Regression Check'
        if: steps.perf-baseline.outcome == 'success'
        run: |
          PREV_FILE=$(find ./prev-perf -name "baseline.json" -print -quit)
          CURR_FILE="./bench-baseline.json"
          if [ -f "$PREV_FILE" ] && [ -f "$CURR_FILE" ]; then
            echo "Comparing performance baseline..."
            
            # Extract P95 for critical endpoints using python
            python3 << 'PYEOF'
          import json, sys
          
          with open("./prev-perf/baseline.json") as f:
              prev = json.load(f)
          with open("./bench-baseline.json") as f:
              curr = json.load(f)
          
          regression_found = False
          errors = []
          
          # Build lookup by endpoint
          prev_map = {r["endpoint"]: r for r in prev["results"]}
          curr_map = {r["endpoint"]: r for r in curr["results"]}
          
          for ep, cr in curr_map.items():
              pr = prev_map.get(ep)
              if not pr:
                  continue
              
              # P95 regression check (>50% degradation)
              if pr["p95_ms"] > 0 and cr["p95_ms"] > pr["p95_ms"] * 1.5:
                  regression_found = True
                  errors.append(
                      f"  P95 REGRESSION {ep}: {pr['p95_ms']:.0f}ms → {cr['p95_ms']:.0f}ms "
                      f"(+{((cr['p95_ms']/pr['p95_ms'])-1)*100:.0f}%)"
                  )
              
              # Error rate check (>5% fail rate)
              total = cr["ok"] + cr["fail"]
              if total > 0 and cr["fail"] / total > 0.05:
                  regression_found = True
                  errors.append(
                      f"  ERROR RATE {ep}: {cr['fail']}/{total} fails ({cr['fail']/total*100:.1f}%)"
                  )
          
          if regression_found:
              print("\n".join(errors))
              sys.exit(1)
          else:
              print("✅ Performance stable — no regression detected")
          PYEOF
          fi

      - name: '📤 Upload Performance Baseline'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: ./bench-baseline.json
          retention-days: 60

      - name: Stop API
        if: always()
        run: |
          pkill -f "dotnet run.*Agent1.Api" 2>/dev/null || true
          echo "API stopped"

  # ═══════════════════════════════════════
  # Job 5: 邮件通知 (成功摘要 vs 失败告警, 双通道)
  # - 成功: 发送覆盖率 + 测试数 + 性能摘要
  # - 失败: 发送详细错误上下文 + 工作流链接
  # 所需 Secrets: QQ_EMAIL, QQ_SMTP_CODE
  # ═══════════════════════════════════════
  notify:
    needs: [build-and-test, frontend-test, integration-test, benchmark, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.QQ_EMAIL }}" ] || [ -z "${{ secrets.QQ_SMTP_CODE }}" ]; then
            echo "::warning::QQ_EMAIL or QQ_SMTP_CODE secret not configured, skipping email notification"
            echo "SKIP_NOTIFY=true" >> $GITHUB_ENV
          fi

      - name: Determine CI status
        if: env.SKIP_NOTIFY != 'true'
        id: status
        run: |
          if [ "${{ needs.build-and-test.result }}" = "failure" ] || \
             [ "${{ needs.frontend-test.result }}" = "failure" ] || \
             [ "${{ needs.integration-test.result }}" = "failure" ] || \
             [ "${{ needs.benchmark.result }}" = "failure" ]; then
            echo "ci_status=failure" >> $GITHUB_OUTPUT
          else
            echo "ci_status=success" >> $GITHUB_OUTPUT
          fi

      - name: '✅ Send Success Summary'
        if: env.SKIP_NOTIFY != 'true' && steps.status.outputs.ci_status == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_SMTP_CODE }}
          subject: "[Agent1 CI ✅] ${{ github.repository }} — ${{ github.ref_name }}"
          body: |
            ✅ CI 工作流全部通过！

            📦 仓库: ${{ github.repository }}
            🌿 分支: ${{ github.ref_name }}
            📝 提交: ${{ github.sha }}
            👤 触发者: ${{ github.actor }}

            ──────────────────────────────
            📊 质量报告
            ──────────────────────────────
            🧪 单元/API测试: ${{ needs.build-and-test.outputs.tests_passed }} / ${{ needs.build-and-test.outputs.tests_total }} 通过
            📈 行覆盖率:   ${{ needs.build-and-test.outputs.coverage_line }}
            🌿 分支覆盖率: ${{ needs.build-and-test.outputs.coverage_branch }}

            ──────────────────────────────
            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.QQ_EMAIL }}
          from: ${{ secrets.QQ_EMAIL }}

      - name: '🚨 Send Failure Alert'
        if: env.SKIP_NOTIFY != 'true' && steps.status.outputs.ci_status == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 587
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_SMTP_CODE }}
          subject: "[Agent1 CI 🚨] ${{ github.repository }} — ${{ github.ref_name }}"
          body: |
            🚨 CI 工作流执行失败！

            📦 仓库: ${{ github.repository }}
            🌿 分支: ${{ github.ref_name }}
            📝 提交: ${{ github.sha }}
            📨 提交信息: ${{ github.event.head_commit.message }}
            👤 触发者: ${{ github.actor }}

            ──────────────────────────────
            🔴 失败 Job:
            ──────────────────────────────
            build-and-test:    ${{ needs.build-and-test.result }}
            frontend-test:     ${{ needs.frontend-test.result }}
            integration-test:  ${{ needs.integration-test.result }}
            benchmark:         ${{ needs.benchmark.result }}
            docker:            ${{ needs.docker.result }}

            ──────────────────────────────
            🔗 查看详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.QQ_EMAIL }}
          from: ${{ secrets.QQ_EMAIL }}

  # ═══════════════════════════════════════
  # Job 5: Staging 环境自动部署
  # 基于 GHCR 预构建镜像，SSH 到 staging 服务器执行 docker-compose pull + up
  # 触发条件: main / feature/partner-dev 分支 push，且 build-test + docker 均通过
  # 所需 Secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY
  # 所需 Vars: STAGING_URL, STAGING_PROJECT_PATH
  # ═══════════════════════════════════════
  staging-deploy:
    needs: [build-and-test, integration-test, docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/partner-dev'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Check secrets availability
        run: |
          if [ -z "${{ secrets.STAGING_HOST }}" ] || [ -z "${{ secrets.STAGING_SSH_KEY }}" ]; then
            echo "::warning::STAGING_HOST or STAGING_SSH_KEY not configured, skipping staging deploy"
            echo "SKIP_DEPLOY=true" >> $GITHUB_ENV
          fi

      - name: Deploy to staging via SSH
        if: env.SKIP_DEPLOY != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ vars.STAGING_PROJECT_PATH }}
            echo "[DEPLOY] Pulling latest images..."
            docker-compose -f docker-compose.yml -f docker-compose.staging.yml pull api
            echo "[DEPLOY] Restarting api service..."
            docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans api
            echo "[DEPLOY] Waiting for health check..."
            sleep 10
            docker-compose ps

      - name: Smoke test (health check)
        if: env.SKIP_DEPLOY != 'true'
        run: |
          echo "[SMOKE] Waiting for service to stabilize..."
          for i in $(seq 1 12); do
            if curl -sf ${{ vars.STAGING_URL }}/health/live 2>/dev/null; then
              echo ""
              echo "[SMOKE] ✅ /health/live OK"
              break
            fi
            echo "[SMOKE] Attempt $i/12 — not ready yet, retrying in 5s..."
            sleep 5
          done
          curl -sf ${{ vars.STAGING_URL }}/health || echo "::warning::/health endpoint check failed (may need LLM/DB)"
          echo "[SMOKE] ✅ Deployment smoke test complete"
